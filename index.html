  const t=today(),m=+t.slice(5,7),d=+t.slice(8,10),v=m*100+d,a=e.from[0]*100+e.from[1],b=e.to[0]*100+e.to[1];
  return a<=b?(v>=a&&v<=b):(v>=a||v<=b);
}
const eventsNow=()=>EVENTS.filter(e=>eventActive(e.id));

const Village=(function(){
/* ===== World: fields, painted ground, walk grid ===== */
const T=40, SC=2;
let W=40, H=28, PW=W*T*SC, PH=H*T*SC;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(20261022);
const lat=new Float32Array(65536); for(let i=0;i<65536;i++) lat[i]=rnd();
const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);
  const x0=xi&255,x1=(xi+1)&255,y0=(yi&255)<<8,y1=((yi+1)&255)<<8;
  const a=lat[y0|x0],b=lat[y0|x1],c=lat[y1|x0],d=lat[y1|x1];
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm(x,y){return (vn(x,y)*.5+vn(x*2.03+5.2,y*2.03+1.3)*.25+vn(x*4.1+9.7,y*4.1+3.1)*.125)/.875}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};

const ISL={x:20,y:14.2,rx:17.5,ry:11};
function hLandV(x,y){const ex=(x-ISL.x)/ISL.rx,ey=(y-ISL.y)/ISL.ry;
  return 1-Math.sqrt(ex*ex+ey*ey)+(fbm(x*.21+3,y*.21+7)-.5)*.2}
function hRockV(x,y){return 4.9+(fbm(x*.28,y*.28+9)-.5)*3.6-y}
function hPondV(x,y){return 1-Math.sqrt(((x-9)/2.7)**2+((y-17.4)/1.9)**2)+(fbm(x*.5,y*.5)-.5)*.25}
function chanX(y){return 27+(vn(y*.35,11.5)-.5)*1.5}
function hChanV(x,y){return 1-Math.abs(x-chanX(y))/1.25}
const SEGS=[ // x1,y1,x2,y2,halfwidth
 [18,11.4,18,14.8,1.0],[21,15.2,25.2,14.9,.95],[28.8,14.9,31.8,14.4,.95],
 [31.8,14.4,31.8,12.8,.95],[31.9,14.4,32.2,22.2,.85],[32,13.6,35.2,10.6,.8],
 [14.6,15.2,7.6,14.8,.9],[7.6,14.8,7.2,12.4,.9],[18,17.4,18,20.6,.8]];
function segD(px,py,s){const dx=s[2]-s[0],dy=s[3]-s[1];const t=clamp(((px-s[0])*dx+(py-s[1])*dy)/(dx*dx+dy*dy),0,1);
  return Math.hypot(px-(s[0]+dx*t),py-(s[1]+dy*t))}
function segsPath(x,y,SEGS_,plaza){let m=-9;for(const s of SEGS_){const v=1-segD(x,y,s)/s[4];if(v>m)m=v}
  if(!plaza)return m;const pl=1-Math.sqrt(((x-plaza[0])/plaza[2])**2+((y-plaza[1])/plaza[3])**2);
  return Math.max(m,pl)}
function hPathV(x,y){return segsPath(x,y,SEGS,[18,15.3,3.5,2.5])}


/* ---- zones: the home island and the islands you can fly to ---- */
const PAL_HOME={seaA:[96,200,196],seaB:[22,96,134],sand:[226,206,158],gA:[88,138,66],gB:[118,164,78],gdk:.14,rock:[118,112,108],path:[206,172,118],pondA:[88,188,190],pondB:[40,128,150],tuft:['rgba(52,96,46,.55)','rgba(150,196,92,.55)'],flowers:['#fff6df','#ffd25c','#ff9fb4','#a9c7ff','#ffffff','#ffb36b'],foam:1};
const HOME={id:'home',name:'Home Isle',W:40,H:28,landV:hLandV,rockV:hRockV,pondV:hPondV,chanV:hChanV,pathV:hPathV,pal:PAL_HOME,home:true};
let Z=HOME;
const landV=(x,y)=>Z.landV(x,y), rockV=(x,y)=>Z.rockV(x,y), pondV=(x,y)=>Z.pondV(x,y), chanV=(x,y)=>Z.chanV(x,y), pathV=(x,y)=>Z.pathV(x,y);
/* build the field functions for a small island from a handful of numbers */
function mkIsle(c){
  const sx=c.seed||3;
  return {id:c.id,W:c.W,H:c.H,pal:c.pal,
    landV:(x,y)=>{const ex=(x-c.cx)/c.rx,ey=(y-c.cy)/c.ry;return 1-Math.sqrt(ex*ex+ey*ey)+(fbm(x*.21+sx,y*.21+sx*2)-.5)*(c.wob||.2)},
    rockV:(x,y)=>{let m=-9;for(const b of c.rocks||[]){const v=b[2]-Math.hypot(x-b[0],y-b[1])+(fbm(x*.3+sx,y*.3)-.5)*3;if(v>m)m=v}return m},
    pondV:(x,y)=>{let m=-9;for(const p of c.ponds||[]){const v=1-Math.sqrt(((x-p[0])/p[2])**2+((y-p[1])/p[3])**2)+(fbm(x*.5+sx,y*.5)-.5)*.25;if(v>m)m=v}return m},
    chanV:()=>-9,
    pathV:(x,y)=>segsPath(x,y,c.segs||[],c.plaza)};
}
function setZone(z){
  Z=z;W=z.W;H=z.H;PW=W*T*SC;PH=H*T*SC;
  walk.length=0;blocked.length=0;for(let j=0;j<H;j++){walk.push(new Array(W).fill(false));blocked.push(new Array(W).fill(false))}
  WATERSPOTS.length=0;
}

/* ---- paint the ground once ---- */
async function paintGround(onProg){
  const P=Z.pal;
  const base=document.createElement('canvas');base.width=PW;base.height=PH;
  const bc=base.getContext('2d');
  const GS=4,gw=Math.ceil(PW/GS)+2,gh=Math.ceil(PH/GS)+2;
  const FL=new Float32Array(gw*gh),FR=new Float32Array(gw*gh),FP=new Float32Array(gw*gh),FC=new Float32Array(gw*gh),FH=new Float32Array(gw*gh);
  const k=1/(SC*T);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){const x=gx*GS*k,y=gy*GS*k,i=gy*gw+gx;
    FL[i]=landV(x,y);FR[i]=rockV(x,y);FP[i]=pondV(x,y);FC[i]=chanV(x,y);FH[i]=pathV(x,y)}
  const img=bc.createImageData(PW,PH),d32=new Uint32Array(img.data.buffer);
  const mix=(a,b,t)=>a+(b-a)*t;
  let tSlice=performance.now();
  for(let py=0;py<PH;py++){
    if(py%16===0&&performance.now()-tSlice>28){ if(onProg)onProg(py/PH); await new Promise(r=>setTimeout(r,0)); tSlice=performance.now(); }
    const gy=(py/GS)|0,fy=py/GS-gy,y=py*k;
    for(let px=0;px<PW;px++){
      const gx=(px/GS)|0,fx=px/GS-gx,x=px*k,i=gy*gw+gx;
      const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
      const lv=FL[i]*w00+FL[i+1]*w10+FL[i+gw]*w01+FL[i+gw+1]*w11;
      const rv=FR[i]*w00+FR[i+1]*w10+FR[i+gw]*w01+FR[i+gw+1]*w11;
      const pv=FP[i]*w00+FP[i+1]*w10+FP[i+gw]*w01+FP[i+gw+1]*w11;
      const cv_=FC[i]*w00+FC[i+1]*w10+FC[i+gw]*w01+FC[i+gw+1]*w11;
      const hv=FH[i]*w00+FH[i+1]*w10+FH[i+gw]*w01+FH[i+gw+1]*w11;
      // sea
      const dd=ss(0,1,clamp(-lv/.34,0,1));
      let r=mix(P.seaA[0],P.seaB[0],dd),g=mix(P.seaA[1],P.seaB[1],dd),b=mix(P.seaA[2],P.seaB[2],dd);
      const wav=(vn(x*1.4,y*5.5)-.5)*14;r+=wav*.4;g+=wav;b+=wav*.8;
      if(lv<-.05){d32[py*PW+px]=0xFF000000|((clamp(b,0,255)|0)<<16)|((clamp(g,0,255)|0)<<8)|(clamp(r,0,255)|0);continue}
      const n1=vn(x*2.6,y*2.6),brush=vn(x*10,y*2.4)-.5,fine=hash(px,py)-.5,big=fbm(x*.45,y*.45);
      // sand
      const sw=ss(0,.013,lv);
      let sr=P.sand[0]+brush*26+fine*8,sg=P.sand[1]+brush*24+fine*8,sb=P.sand[2]+brush*22+fine*8;
      sr-=ss(.05,0,lv)*0;
      r=mix(r,sr,sw);g=mix(g,sg,sw);b=mix(b,sb,sw);
      // grass
      const gm=ss(.06,.115,lv+(n1-.5)*.03);
      const gl=mix(0,1,ss(.3,.7,big));
      let gr=mix(P.gA[0],P.gB[0],gl)+brush*26+fine*10-(n1-.5)*10;
      let gg=mix(P.gA[1],P.gB[1],gl)+brush*30+fine*12-(n1-.5)*10;
      let gb=mix(P.gA[2],P.gB[2],gl)+brush*14+fine*8;
      // cliff shadow on grass south of rocks
      const cs=ss(-1.6,0,rv)*(1-ss(0,.2,rv));gr*=1-cs*.34;gg*=1-cs*.3;gb*=1-cs*.2;
      // tree-ish darker meadow patches
      const dk=ss(.62,.8,fbm(x*.33+40,y*.33+8));gr*=1-dk*P.gdk;gg*=1-dk*P.gdk*.6;gb*=1-dk*P.gdk;
      r=mix(r,gr,gm*sw);g=mix(g,gg,gm*sw);b=mix(b,gb,gm*sw);
      // rock
      const rw=ss(-.05,.28,rv)*sw;
      const strata=vn(x*1.8,y*7)-.5;
      let kr=P.rock[0]+strata*34+fine*14+n1*10,kg=P.rock[1]+strata*30+fine*12+n1*8,kb=P.rock[2]+strata*26+fine*10+n1*6;
      const lit=ss(.2,2.2,rv);kr+=lit*14;kg+=lit*14;kb+=lit*12;
      const edge=1-ss(.05,.6,rv);kr*=1-edge*.22;kg*=1-edge*.22;kb*=1-edge*.2;
      r=mix(r,kr,rw);g=mix(g,kg,rw);b=mix(b,kb,rw);
      // pond + channel water
      const pw=ss(0,.09,pv),cw=ss(0,.1,cv_)*sw;
      const rimP=ss(-.2,0,pv)*(1-pw),rimC=ss(-.22,0,cv_)*(1-cw)*sw;
      r*=1-(rimP+rimC)*.18;g*=1-(rimP+rimC)*.12;b*=1-(rimP+rimC)*.1;
      const pd=ss(0,.75,pv);
      const pr=mix(P.pondA[0],P.pondB[0],pd)+wav*.4,pg=mix(P.pondA[1],P.pondB[1],pd)+wav,pb=mix(P.pondA[2],P.pondB[2],pd)+wav*.8;
      r=mix(r,pr,pw);g=mix(g,pg,pw);b=mix(b,pb,pw);
      const cdp=ss(0,.9,cv_);
      const cr=mix(92,44,cdp)+wav*.4,cg=mix(196,140,cdp)+wav,cb=mix(196,160,cdp)+wav*.8;
      r=mix(r,cr,cw);g=mix(g,cg,cw);b=mix(b,cb,cw);
      // foam at the coast
      const fo=Math.exp(-(((lv+.004)/.011)**2))*(.55+.45*vn(x*3,y*3));
      r=mix(r,246,fo*.8);g=mix(g,250,fo*.8);b=mix(b,248,fo*.8);
      // path
      const hw=ss(.02,.3,hv+(n1-.5)*.35)*sw*(1-pw)*(1-cw)*(1-rw);
      const cob=vn(x*5.2,y*5.2);
      let hr=P.path[0]+fine*9+brush*18+(cob-.5)*26,hg=P.path[1]+fine*9+brush*16+(cob-.5)*22,hb=P.path[2]+fine*8+brush*10+(cob-.5)*16;
      const rim=ss(.02,.14,hv)*(1-ss(.14,.3,hv));hr-=rim*18;hg-=rim*20;hb-=rim*20;
      r=mix(r,hr,hw);g=mix(g,hg,hw);b=mix(b,hb,hw);
      d32[py*PW+px]=0xFF000000|((clamp(b,0,255)|0)<<16)|((clamp(g,0,255)|0)<<8)|(clamp(r,0,255)|0);
    }
  }
  bc.putImageData(img,0,0);
  bc.save();bc.scale(SC,SC);
  decals(bc);
  bc.restore();
  return base;
}

/* ---- little hand-placed ground details ---- */
const WATERSPOTS=[];
function isGrass(x,y,m=0){return landV(x,y)>.14&&rockV(x,y)<-.6&&pathV(x,y)<-.25-m&&pondV(x,y)<-.3&&chanV(x,y)<-.4}
function decals(c){
  const r=mulberry(77);
  // grass tufts
  for(let n=0;n<2600;n++){const x=r()*W,y=r()*H;if(!isGrass(x,y))continue;
    const px=x*T,py=y*T,h=3+r()*5,col=r()<.5?Z.pal.tuft[0]:Z.pal.tuft[1];
    c.strokeStyle=col;c.lineWidth=1.2;c.beginPath();
    for(let b=-1;b<=1;b++){c.moveTo(px+b*2,py);c.quadraticCurveTo(px+b*2+b*1.5,py-h*.6,px+b*3.4,py-h)}
    c.stroke()}
  // flower clumps
  const cols=Z.pal.flowers||[];
  for(let n=0;cols.length&&n<420;n++){const x=r()*W,y=r()*H;if(!isGrass(x,y,.1))continue;
    const col=cols[(r()*cols.length)|0];
    for(let k=0;k<4+(r()*4|0);k++){const fx=x*T+(r()-.5)*18,fy=y*T+(r()-.5)*12;
      c.fillStyle='rgba(40,80,40,.5)';c.fillRect(fx-.4,fy,.8,4);
      c.fillStyle=col;c.beginPath();c.arc(fx,fy,1.7,0,6.3);c.fill();
      c.fillStyle='#e8b23a';c.beginPath();c.arc(fx,fy,.6,0,6.3);c.fill()}}
  // pebbles on and beside paths
  for(let n=0;n<700;n++){const x=r()*W,y=r()*H;const hv=pathV(x,y);if(hv<-.05||hv>.5||landV(x,y)<.1||chanV(x,y)>-.1||pondV(x,y)>-.1)continue;
    c.fillStyle=r()<.5?'rgba(120,98,70,.55)':'rgba(236,218,184,.6)';
    c.beginPath();c.ellipse(x*T,y*T,1+r()*1.8,.8+r()*1,0,0,6.3);c.fill()}
  // reeds round the pond
  for(let n=0;Z.home&&n<160;n++){const a=r()*6.3,rx=2.9+r()*.3,ry=2.1+r()*.3;const x=9+Math.cos(a)*rx,y=17.4+Math.sin(a)*ry;
    if(pondV(x,y)>-.02||pondV(x,y)<-.5||pathV(x,y)>0)continue;
    const px=x*T,py=y*T;c.strokeStyle='#4f7a3a';c.lineWidth=1.3;c.beginPath();
    for(let b=0;b<3;b++){c.moveTo(px+b*2,py);c.quadraticCurveTo(px+b*2+(r()-.5)*4,py-10,px+b*2+(r()-.5)*6,py-14-r()*6)}c.stroke();
    if(r()<.4){c.fillStyle='#7a5a34';c.fillRect(px+2,py-18,2.4,6)}}
  // lily pads
  for(let n=0;Z.home&&n<7;n++){const x=7.9+r()*2.4,y=16.8+r()*1.3;if(pondV(x,y)<.25)continue;
    c.fillStyle='#4c9a52';c.beginPath();c.arc(x*T,y*T,5+r()*3,.4,6.3-.1);c.lineTo(x*T,y*T);c.fill();
    if(r()<.5){c.fillStyle='#ffd9e6';c.beginPath();c.arc(x*T+1,y*T-1,2,0,6.3);c.fill()}}
  // water sparkle spots (animated live)
  const r2=mulberry(5);
  for(let n=0;n<900&&WATERSPOTS.length<110;n++){const x=r2()*W,y=r2()*H;
    if(landV(x,y)<-.03||(pondV(x,y)>.15)||(chanV(x,y)>.2&&landV(x,y)>.1))WATERSPOTS.push([x*T,y*T,r2()*6.3])}
}

/* ---- what can be walked on ---- */
const walk=[];for(let j=0;j<H;j++){walk.push(new Array(W).fill(false))}
const bridgeCells=[];for(let i=25;i<=28;i++){bridgeCells.push([i,14],[i,15])}
const dockCells=[[31,21],[32,21],[31,22],[32,22],[31,23],[32,23],[31,24],[32,24]];   /* walkable only once the dock is built */
function buildWalk(){
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const x=i+.5,y=j+.5;
    walk[j][i]=landV(x,y)>.05&&rockV(x,y)<-.55&&pondV(x,y)<-.1&&chanV(x,y)<-.12}
}

/* ===== Painted sprites: buildings, trees, props ===== */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*SC);c.height=Math.ceil(h*SC);
  const x=c.getContext('2d');x.scale(SC,SC);fn(x,w,h);return c}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}
function ell(c,x,y,rx,ry,fill){c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,0,0,6.3);c.fill()}
function shadowBlob(c,x,y,rx,ry,a=.3){const g=c.createRadialGradient(x,y,1,x,y,rx);g.addColorStop(0,'rgba(18,34,24,'+a+')');g.addColorStop(1,'rgba(18,34,24,0)');
  c.save();c.translate(0,y);c.scale(1,ry/rx);c.translate(0,-y);c.fillStyle=g;c.beginPath();c.arc(x,y,rx,0,6.3);c.fill();c.restore()}

const SPR={};
function makeSprites(){
  /* ---- pines (3 looks) ---- */
  SPR.pine=[0,1,2].map(v=>mk(70,104,(c,w,h)=>{
    const cols=[['#2e5d3f','#3f7a4b','#58995a'],['#2a553f','#386f4c','#4f8c58'],['#34603a','#47794a','#68a05c']][v];
    shadowBlob(c,38,96,26,9,.38);
    c.fillStyle=lg(c,30,0,40,0,['#7b5634','#5a3b22']);c.fillRect(31,76,9,22);
    const tiers=[[96-22,36,30],[96-42,36,25],[96-62,36,19],[96-80,36,13]];
    [[80,34,26,22],[60,31,23,22],[40,28,20,22],[20,24,16,22]].forEach((t,i)=>{
      const by=t[0]+14,half=t[2]+6-i*1.5;
      c.fillStyle=lg(c,35-half,0,35+half,0,[cols[2],cols[1],cols[0]]);
      c.beginPath();c.moveTo(35,by-t[3]-14);c.lineTo(35+half,by);c.quadraticCurveTo(35,by+6,35-half,by);c.closePath();c.fill();
      c.strokeStyle='rgba(255,255,220,.16)';c.lineWidth=1.4;c.beginPath();
      for(let k=0;k<3;k++){const yy=by-6-k*8;c.moveTo(35-half*.55+k*3,yy);c.quadraticCurveTo(35-half*.2,yy-4,35,yy-2)}c.stroke();
      c.strokeStyle='rgba(10,40,24,.28)';c.beginPath();c.moveTo(35+half*.4,by-4);c.lineTo(35+half*.9,by-1);c.stroke()});
  }));
  /* ---- round bush, boulder ---- */
  SPR.bush=mk(46,34,(c)=>{shadowBlob(c,23,29,18,6,.3);
    [[14,20,11],[26,18,12],[20,13,10],[32,23,8]].forEach(([x,y,r],i)=>{const g=c.createRadialGradient(x-3,y-4,2,x,y,r);g.addColorStop(0,'#7fb15c');g.addColorStop(1,'#3e7342');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.3);c.fill()});
    c.fillStyle='#ff9fb4';[[12,16],[24,12],[30,20],[18,22]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,1.5,0,6.3);c.fill()})});
  SPR.rock=mk(46,34,(c)=>{shadowBlob(c,23,29,19,6,.35);
    c.fillStyle=lg(c,8,8,38,30,['#a7a29c','#77726e','#58544f']);c.beginPath();c.moveTo(6,28);c.quadraticCurveTo(4,12,16,8);c.quadraticCurveTo(28,4,38,14);c.quadraticCurveTo(44,24,38,29);c.closePath();c.fill();
    c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=1.3;c.beginPath();c.moveTo(12,14);c.quadraticCurveTo(22,8,32,14);c.stroke();
    c.fillStyle='rgba(90,130,60,.55)';c.beginPath();c.ellipse(14,26,9,3,0,0,6.3);c.fill()});

  /* ---- the school house ---- */
  SPR.house=mk(280,236,(c,w,h)=>{
    const L=28,R=252,B=224;
    shadowBlob(c,150,B+2,130,13,.38);
    // stone foundation
    c.fillStyle=lg(c,0,196,0,B,['#8d8680','#6c6661']);c.fillRect(L-4,196,R-L+8,B-196);
    c.strokeStyle='rgba(30,26,24,.35)';c.lineWidth=1;
    for(let r=0;r<3;r++){const y=196+r*9;c.beginPath();c.moveTo(L-4,y);c.lineTo(R+4,y);c.stroke();
      for(let x=L+(r%2)*9;x<R;x+=18){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+9);c.stroke()}}

const isleById=id=>id==='home'?HOME:ISLES.find(z=>z.id===id);
function isleStatus(z){
  const days=(S.days||[]).length,sec=ALL_ITEMS.filter(it=>isSecure(it.id)).length;
  const needs=[];if(days<z.days)needs.push(`${z.days-days} more practice day${z.days-days===1?'':'s'}`);if(sec<z.secure)needs.push(`${z.secure-sec} more secure fact${z.secure-sec===1?'':'s'}`);
  return {ok:!needs.length||S.settings.exploreAny,need:needs.join(' and ')};
}
function zoneState(id){S.zones=S.zones||{};return S.zones[id]||(S.zones[id]={visited:false,chest:false})}

/* ---- the island's own objects ---- */
function buildIsle(){
  const z=Z;
  addObj(SPR.pad,z.spawn[0]+.5,z.spawn[1]+1.1,40,22,{under:true});
  addObj(SPR.sign,z.spawn[0]-1.6,z.spawn[1]+.6,30,64,{});block([[Math.floor(z.spawn[0]-1.6),Math.floor(z.spawn[1]+.3)]],`${z.name}. Tap the Map button to fly somewhere else.`);
  (z.stones||[]).forEach(([x,y,t],k)=>{addObj(SPR.stone[z.id==='beach'?1:z.id==='lava'?2:0],x,y,26,70,{glow:[26,44],glowCol:z.id==='lava'?'255,150,70':z.id==='beach'?'255,220,110':'150,200,255'});block([[Math.floor(x),Math.floor(y-.3)]],t)});
  if(z.chest){const ch=zoneState(z.id).chest;
  addObj(ch?SPR.chestOpen:SPR.chest,z.chest.x,z.chest.y,26,40,{});block([[Math.floor(z.chest.x),Math.floor(z.chest.y-.3)]],null,'chest');}
  z.build();
}
function openChest(){
  const z=Z,zs=zoneState(z.id);
  if(zs.chest){vsay('The chest is empty now. You already found what was inside.');return}
  if(z.chest.needs&&!skillOwned(S.dragon,z.chest.needs)){vsay(z.chest.lock);return}
  zs.chest=true;S.embers+=z.chest.embers;
  S.inv.closet=S.inv.closet||[];if(!S.inv.closet.includes(z.chest.item))S.inv.closet.push(z.chest.item);
  Audio_.fx('fanfare');saveState();buildObjects();hud();
  for(let k=0;k<22;k++)parts.push({t:'spark',x:z.chest.x*T+(Math.random()-.5)*30,y:z.chest.y*T-20,vx:(Math.random()-.5)*80,vy:-30-Math.random()*60,age:0,life:1+Math.random()*.6});
  vsay(`${z.chest.text} (+${z.chest.embers} embers.) You can wear it from the Clothes Shop.`);
}

function chain(title,n,pool,onDone){
  let step=0,right=0;
  const next=()=>{if(step>=n){onDone(right);return}
    const ok=shardQuestion(0,0,{q:wordProb(pick(pool)),title:`${title}: ${step+1} of ${n}`,bonus:0,intro:'Pick the answer. No rush.',ok:'Yes!',fail:'That is fine, keep going.',okLabel:'Next',skipLabel:'Not now',done:g=>{if(g)right++;step++;next()}});
    if(!ok)vtoast('Nothing to do here right now.',2000)};
  next()}
function poolFor(list){const f=feedKinds(),p=f.filter(k=>list.includes(k));return p.length?p:f}

 bakery(){const n=dayB().bakery||0,D=S.dragon.name;

  const a=RR(1,6),b=RR(1,10-a);opts.push({text:`${b} more than ${a}`,ans:a+b});
  const p=RR(1,8);opts.push({text:`the partner of ${p} that makes 10`,ans:10-p});
  if(k.has('sub20')||k.has('missing')){const x=RR(2,9);opts.push({text:`10 take away ${x}`,ans:10-x})}
  if(k.has('double')){const d=RR(1,5);opts.push({text:`double ${d}`,ans:d*2})}
  if(k.has('half')){const h=RR(1,5);opts.push({text:`half of ${h*2}`,ans:h})}
  const o=pick(opts);return o}
function hsToday(){return S.day.hs}
function hsStart(){
  const o=hsClue();const nums=[o.ans];while(nums.length<HS_SPOTS.length){const n=RR(1,10);if(!nums.includes(n))nums.push(n)}
  const sh=shuffle(nums);S.day.hs={text:o.text,ans:o.ans,flags:HS_SPOTS.map((p,i)=>({n:sh[i],x:p[0],y:p[1]})),tries:0,found:false};saveState();buildObjects()}
const HS_FINDS=["A sheet with two eyeholes wobbles out. It is Millie, dressed as a ghost! She says nothing, but she is very proud.","Behind the flag sits Millie, wearing a pumpkin on her head. She has no idea how it got there.","Millie leaps out in a cloud of leaves. She is wearing a tiny cape and looks extremely pleased with herself."];
function hsClueSay(){const h=hsToday();vsay(`Millie is hiding behind the flag that is ${h.text}. Work out the number, then find that flag on the Village Green.`)}
function hsBoard(){
  if(!S.day.trained){vsay("This is the hide and seek board. Millie hides after today's practice is done. Come back then!");return}
  if(dayB().hide){vsay("Millie has been found today. She is already planning a better hiding spot for tomorrow.");return}
  if(!hsToday())hsStart();
  hsClueSay()}
function hsFlag(i){
  const h=hsToday();if(!h||h.found)return;const f=h.flags[i];if(!f)return;
  if(f.n===h.ans){h.found=true;dayB().hide=1;S.day.hs=null;
    S.log.push({t:Date.now(),id:'word',ok:true,clean:h.tries===0,hints:0,att:h.tries,ms:0,tool:'none',kind:'word'});reward(4);buildObjects();hud();
    vsay(`${pick(HS_FINDS)} (+4 embers.)`,[{label:'Good cat',fn:()=>setTimeout(()=>tellJoke(),200)}]);return}
  h.tries++;saveState();Audio_.fx('soft');
  if(h.tries>=3){vsay(`That is flag ${f.n}. Millie is not here. The clue is "${h.text}", which makes ${h.ans}. Look for flag ${h.ans}.`)}

/* scalloped bat-style wing: shoulder SC, tip T, trailing root R */
function wing(c,S0,T0,R0,dark){
  const [sx,sy]=S0,[tx,ty]=T0,[rx,ry]=R0;
  const pts=[];for(let k=1;k<=3;k++)pts.push([tx+(rx-tx)*k/3,ty+(ry-ty)*k/3]);
  c.fillStyle=lg(c,sx,sy,tx,ty,dark?[DRG.mem2,'#7e2f22']:[DRG.mem,DRG.mem2]);
  c.beginPath();c.moveTo(sx,sy);c.lineTo(tx,ty);
  let px=tx,py=ty;
  pts.forEach(([x,y])=>{const mx=(px+x)/2+(sx-(px+x)/2)*.16,my=(py+y)/2+(sy-(py+y)/2)*.16;c.quadraticCurveTo(mx,my,x,y);px=x;py=y});
  c.lineTo(sx,sy);c.closePath();c.fill();
  stroke(c,'rgba(70,24,16,.7)',1.3);c.beginPath();c.moveTo(sx,sy);c.lineTo(tx,ty);c.stroke();
  pts.slice(0,2).forEach(([x,y])=>{c.beginPath();c.moveTo(sx,sy);c.lineTo(x,y);c.stroke()});
  c.fillStyle='rgba(255,255,255,.14)';c.beginPath();c.moveTo(sx,sy);c.lineTo(tx,ty);c.lineTo((tx+rx)/2,(ty+ry)/2);c.closePath();c.fill();
}
function tailTip(c,x,y,dx,dy){

  if(LK.gear&&LK.gear.tail==='blade'){
    c.fillStyle='#c4ccd3';c.strokeStyle='#4e575f';c.lineWidth=1.2;c.beginPath();c.moveTo(x+px*4,y+py*4);c.lineTo(x+ux*17,y+uy*17);c.lineTo(x-px*4,y-py*4);c.closePath();c.fill();c.stroke();
    c.fillStyle='#7a5a36';c.beginPath();c.arc(x,y,4.2,0,6.3);c.fill();c.strokeStyle='#fff';c.globalAlpha=.6;c.beginPath();c.moveTo(x+ux*3,y+uy*3);c.lineTo(x+ux*14,y+uy*14);c.stroke();c.globalAlpha=1;return}
  if(LK.tail==='flame'){const fl=1+.18*Math.sin(Date.now()/90);
    c.fillStyle='#ff8a3d';c.beginPath();c.moveTo(x-5,y+1);c.quadraticCurveTo(x-6,y-9*fl,x,y-16*fl);c.quadraticCurveTo(x+6,y-9*fl,x+5,y+1);c.closePath();c.fill();
    c.fillStyle='#ffd36b';c.beginPath();c.moveTo(x-2.6,y+1);c.quadraticCurveTo(x-3,y-5,x,y-9*fl);c.quadraticCurveTo(x+3,y-5,x+2.6,y+1);c.closePath();c.fill();return}
  if(LK.tail==='club'){c.fillStyle=DRG.body2;c.beginPath();c.arc(x+ux*3,y+uy*3,6,0,6.3);c.fill();
    c.strokeStyle=shade(DRG.body,.5);c.lineWidth=2.2;c.lineCap='round';[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{c.beginPath();c.moveTo(x+ux*3+a*5,y+uy*3+b*5);c.lineTo(x+ux*3+a*9,y+uy*3+b*9);c.stroke()});return}
  c.fillStyle=DRG.mem2;c.beginPath();c.moveTo(x-px*2,y-py*2);c.lineTo(x-px*8+ux*6,y-py*8+uy*6);c.lineTo(x+ux*14,y+uy*14);c.lineTo(x+px*8+ux*6,y+py*8+uy*6);c.lineTo(x+px*2,y+py*2);c.closePath();c.fill();
}

/* o: {dir, ph, flying, flap (radians), bank, rider(fn)} drawn with feet at origin */
function drawDragon(c,o){
  const dir=o.dir,fly=!!o.flying,f=fly?Math.sin(o.flap):0;
  setLook(o.look);

  const bodyG=(x0,y0,x1,y1)=>lg(c,x0,y0,x1,y1,[DRG.body,DRG.body2]);
  if(side){
    // far wing
    if(fly)wing(c,[-2,-26],[-6-26*.5*(1+.3*-f),-26-33*(-f)*.9-4],[-17,-14],true);

    stroke(c,DRG.body,6);c.beginPath();c.moveTo(-12,-14);c.quadraticCurveTo(-30,-10+tw,-44,-16+tw*1.3);c.stroke();
    tailTip(c,-44,-16+tw*1.3,-1,-.25);
    // legs (far)
    if(!fly){c.fillStyle=DRG.body2;c.beginPath();c.roundRect(-11-walkS*3.5,-9,6,9,3);c.fill();c.beginPath();c.roundRect(5+walkS*3.5,-9,6,9,3);c.fill()}
    else{c.fillStyle=DRG.body2;c.beginPath();c.roundRect(-9,-9,6,8,3);c.fill();c.beginPath();c.roundRect(7,-9,6,8,3);c.fill()}
    // body
    c.fillStyle=bodyG(0,-30,0,-4);c.beginPath();c.ellipse(0,-16,19,11.5,-.05,0,6.3);c.fill();
    c.fillStyle=DRG.belly;c.beginPath();c.ellipse(4,-11,14,6.4,.05,0,6.3);c.fill();
    c.strokeStyle='rgba(120,90,30,.3)';c.lineWidth=1;for(let k=0;k<4;k++){c.beginPath();c.moveTo(-6+k*6,-15);c.lineTo(-6+k*6,-8);c.stroke()}
    // spines

    bodyMarks(c,'side');bodyArmour(c,'side');
    // neck + head
    stroke(c,DRG.body,10);c.beginPath();c.moveTo(11,-20);c.quadraticCurveTo(18,-26,22,-29);c.stroke();
    c.fillStyle=bodyG(0,-40,0,-20);c.beginPath();c.ellipse(25,-30,10.4,8.4,-.1,0,6.3);c.fill();
    c.fillStyle=DRG.body;c.beginPath();c.ellipse(33,-27,6.6,5,.1,0,6.3);c.fill();
    c.fillStyle=DRG.belly;c.beginPath();c.ellipse(33,-24.4,5.6,2.4,.1,0,6.3);c.fill();
    c.fillStyle='rgba(30,50,40,.7)';c.beginPath();c.arc(37,-29,1,0,6.3);c.fill();
    // ear fin + horns
    c.fillStyle=DRG.mem;c.beginPath();c.moveTo(18,-33);c.quadraticCurveTo(10,-40,7,-31);c.quadraticCurveTo(13,-33,16,-27);c.closePath();c.fill();
    hornShape(c,21,-37,-9,-9,12);hornShape(c,25,-38,-3,-12,10);
    // eye
    c.fillStyle=DRG.eye;c.beginPath();c.ellipse(27,-32,3.3,3.5,0,0,6.3);c.fill();
    c.fillStyle='#1a2b1c';c.beginPath();c.ellipse(27.4,-32,1,3,0,0,6.3);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(26.2,-33.4,1,0,6.3);c.fill();
    stroke(c,'rgba(20,50,40,.6)',1.4);c.beginPath();c.moveTo(23,-36);c.lineTo(30,-35);c.stroke();
    crestSpikes(c,22,-37.5,8);headGear(c,'side',25,-30,10.4,8.4);neckGear(c,'side',14,-21,6);
    if(o.mouthOpen){c.fillStyle='#7a2a2a';c.beginPath();c.ellipse(34,-24,4,2,0,0,3.14);c.fill()}
    // near legs
    c.fillStyle=DRG.body;if(!fly){c.beginPath();c.roundRect(-8+walkS*3.5,-9,7,10,3);c.fill();c.beginPath();c.roundRect(8-walkS*3.5,-9,7,10,3);c.fill();

/* ---------- path finding and moving ---------- */
function bfs(si,sj,ti,tj){
  const prev=new Map(),q=[[si,sj]];prev.set(key(si,sj),null);
  while(q.length){const [i,j]=q.shift();if(i===ti&&j===tj)break;
    for(const d of ['u','d','l','r']){const ni=i+DIRS[d][0],nj=j+DIRS[d][1],k=key(ni,nj);
      if(prev.has(k)||!okGround(ni,nj))continue;prev.set(k,[i,j,d]);q.push([ni,nj])}}
  if(!prev.has(key(ti,tj)))return null;
  const out=[];let c=key(ti,tj);while(prev.get(c)){const [i,j,d]=prev.get(c);out.unshift(d);c=key(i,j)}return out}
function line(si,sj,ti,tj){const out=[];let i=si,j=sj;
  while(i!==ti||j!==tj){const di=ti-i,dj=tj-j;if(Math.abs(di)>=Math.abs(dj)){out.push(di>0?'r':'l');i+=di>0?1:-1}else{out.push(dj>0?'d':'u');j+=dj>0?1:-1}}return out}
const stepDur=()=>flying()?(skillOwned(S.dragon,'speed')?.075:.105):.165;
function tryStep(d){
  const [ti,tj]=ptile(),ni=ti+DIRS[d][0],nj=tj+DIRS[d][1];P.dir=d;
  const ok=flying()?(ni>=1&&nj>=1&&ni<W-1&&nj<H-1):(okGround(ni,nj)&&!npcAt(ni,nj));
  if(!ok){bump(ni,nj);return false}
  P.sx=P.x;P.sy=P.y;P.ex=ni+.5;P.ey=nj+.5;P.t=0;P.moving=true;
  if(!flying()){Dg.trail.push([P.sx,P.sy]);if(Dg.trail.length>3)Dg.trail.shift()}
  return true;
}
let lastBump=0;
function bump(i,j){
  if(G.modal||overlayOpen())return;
  const k=key(i,j),a=acts.get(k),n=notes.get(k),now=performance.now();
  if(now-lastBump<900)return;
  const np=npcAt(i,j);if(np){lastBump=now;talkTo(np);return}
  if(a){lastBump=now;runAct(a);return}
  if(n){lastBump=now;vsay(n);return}
  if(!flying()&&(i<0||j<0||i>=W||j>=H||landV(i+.5,j+.5)<.05||pondV(i+.5,j+.5)>-.1||chanV(i+.5,j+.5)>-.12)){lastBump=now;vtoast(done()&&hatched()?'Water ahead. Your dragon can fly you over it.':'Water ahead.',1800)}
}
function interactFacing(){const [ti,tj]=ptile(),ni=ti+DIRS[P.dir][0],nj=tj+DIRS[P.dir][1],k=key(ni,nj);const np=npcAt(ni,nj);if(np){talkTo(np);return}const a=acts.get(k),n=notes.get(k);if(a)runAct(a);else if(n)vsay(n)}
const overlayOpen=()=>{const o=$('#overlay');return !!(o&&o.children.length)};

/* what happens when he walks into a building or onto a special tile */
function runAct(a){
  if(BUILD_ACTS[a])return BUILD_ACTS[a]();
  if(a.startsWith('hs:'))return hsFlag(+a.slice(3));
  if(a==='nest')return openNest();
  if(a==='stall')return openShop();
  if(a==='forge')return openForge();
  if(a==='stables')return openStables();
  if(a==='clothes')return openClothes();
  if(a==='chest')return openChest();
  if(a.startsWith('vill:')){const v=VILLAGERS.find(x=>x.id===a.slice(5));if(v)talkVillager(v);return}

/* ---------- ember shards (new every day, +1 each, +3 for all six) ---------- */function scatterIsle(){
  const r=mulberry(777+Z.W);
  for(let y=1;y<H-1;y+=.9)for(let x=1;x<W-1;x+=.9){
    const px=x+(r()-.5)*.8,py=y+(r()-.5)*.8,i=Math.floor(px),j=Math.floor(py);
    if(!walk[j][i]||inRects(px,py,Z.clear)||!isGrass(px,py,.2)||Math.hypot(px-Z.spawn[0],py-Z.spawn[1])<3.4)continue;
    const cl=fbm(px*.34+11,py*.34),rv=rockV(px,py);
    let p=cl>.5?.55:cl>.42?.2:.05;if(rv>-3.4&&rv<-1.0)p=Math.max(p,.5);
    if(r()>p)continue;

const SHARDS=6;
function todaysShards(){
  const cand=[];
  for(let j=2;j<H-2;j++)for(let i=2;i<W-2;i++){
    if(!walk[j][i]||!isGrass(i+.5,j+.5,.1))continue;
    if(blocked[j][i]||TREES.some(t=>t.i===i&&t.j===j))continue;
    if(Z.home){if(Math.hypot(i-18,j-15)<3)continue;
    if([[14,5.5,21.5,11.8],[8.6,7,14.6,13.9],[20.4,6.8,25.2,11.8],[5,9,9.6,12.6],[29,10.5,33.4,13.4],[34,7,38,10.8]].some(q=>i+.5>q[0]&&i+.5<q[2]&&j+.5>q[1]&&j+.5<q[3]))continue}
    else if(Math.hypot(i-Z.spawn[0],j-Z.spawn[1])<3)continue;
    cand.push([i,j]);
  }
  let h=0;for(const ch of today()+Z.id)h=(h*31+ch.charCodeAt(0))|0;const rr=mulberry(h>>>0);
  const out=[],used=new Set();
  while(out.length<SHARDS&&cand.length){const c=cand[Math.floor(rr()*cand.length)];const k=key(c[0],c[1]);if(used.has(k))continue;used.add(k);
    if(out.every(o=>Math.hypot(o[0]-c[0],o[1]-c[1])>5))out.push(c);else if(used.size>cand.length*.9)out.push(c)}
  return out;
}

/* ---------- a little maths puzzle when an ember shard is found (optional, gentle, never a penalty) ---------- */
function shardQuestion(i,j,cfg){
  cfg=cfg||{};
  let it=null,ans,text;
  if(cfg.q){ans=cfg.q.ans;text=cfg.q.text}
  else{
    const seen=ALL_ITEMS.filter(it=>isSeen(it.id));if(!seen.length)return false;
    const due=dueItems().map(id=>ITEM[id]).filter(Boolean);
    it=(due.length&&Math.random()<.7)?pick(due.slice(0,8)):pick(seen);
    let q;try{q=makeQ(it)}catch(e){return false}
    if(!q||!q.eq)return false;
    ans=q.ans;text=q.eq.map(t=>t.op?t.op:t.ans?'?':t.t).join(' ');
  }
  const pool=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,10-ans,ans+3].filter(n=>n>=0&&n!==ans&&n<=40);
  const opts=shuffle([ans].concat(shuffle(Array.from(new Set(pool))).slice(0,2)));
  const box=$('#vq');if(!box)return false;
  G.modal=true;let tries=0,over=false;
  const bonus=cfg.bonus==null?2:cfg.bonus;let good=false;
  const log=(ok,clean)=>{if(!it){S.log.push({t:Date.now(),id:'word',ok,clean,hints:0,att:tries,ms:0,tool:'none',kind:'word'});return}const gap=applyResult(it.id,{kind:'dash',clean});S.log.push({t:Date.now(),id:it.id,ok,clean,hints:0,att:tries,ms:0,tool:'none',kind:'shard',gap});};
  const close=()=>{box.hidden=true;box.innerHTML='';G.modal=false;hud()};
  const draw=(msg,cls)=>{
    box.innerHTML=`<div class="vq-in"><div class="vq-h">${esc(cfg.title||'Ember puzzle')}</div><div class="vq-eq${text.length>16?' long':''}" aria-live="polite">${esc(text)}</div>
      <div class="vq-opts">${opts.map(o=>`<button class="btn vq-o" data-o="${o}" ${over?'disabled':''}>${o}</button>`).join('')}</div>
      <div class="vq-msg ${cls||''}" role="status">${msg||cfg.intro||`Get it right for ${bonus} bonus embers. No rush, and the shard is yours either way.`}</div>
      <div class="vq-act">${over?`<button class="btn btn-primary" data-vq="ok">${cfg.okLabel||'OK'}</button>`:`<button class="btn btn-ghost" data-vq="skip">${cfg.skipLabel||'Maybe later'}</button>`}</div></div>`;
    box.querySelectorAll('.vq-o').forEach(b=>b.onclick=()=>{
      if(over)return;const o=+b.dataset.o;
      if(o===ans){over=true;good=true;S.embers+=bonus;log(true,tries===0);saveState();Audio_.fx('good');

/* ---------- drawing ---------- */
function drawBridge(c){
  const x0=25.1*T,x1=28.9*T,y0=14.15*T,y1=15.85*T,N=10,pw=(x1-x0)/N;

    const pop=(k>=2&&k<N-2)?Math.min(1,(G.bridge*(N-4)-(k-2))*1.2):1;c.save();c.translate(0,(1-pop)*-10);c.globalAlpha=pop;
    c.fillStyle='rgba(10,50,70,.25)';c.fillRect(x+3,y0+5+sag,pw-1,y1-y0);c.fillStyle=k%2?'#a9784a':'#b98550';c.fillRect(x,y0+sag,pw-1.2,y1-y0);
    c.fillStyle='rgba(60,36,16,.45)';c.fillRect(x+pw-1.4,y0+sag,1.4,y1-y0);c.fillStyle='rgba(255,230,180,.2)';c.fillRect(x+2,y0+sag+3,pw-6,1);c.restore()}

  if(!n){ toast('Type your name first.'); $('#hname').focus(); return; }
  S.hero=Object.assign({},S.hero||{},heroDraft,{done:true,wear:(S.hero&&S.hero.wear)||{}});
  rememberPlayer(SAVE_KEY); saveState(); Audio_.fx('good'); heroDraft=null;
  if(S.dragon) goHome(); else { draft=null; renderCreate(); }
}
function whoHTML(inSheet){
  const profs=listProfiles(), free=freeSlot();

    const h=p.s.hero||blankHero(), dn=p.s.dragon?p.s.dragon.name:'No dragon yet', days=(p.s.days||[]).length;

function playAs(key){
  if(key===SAVE_KEY&&S&&S.hero&&S.hero.done&&screen==='village'){ closeSheet(); return; }
  try{ if(S&&S.hero) saveState(); }catch(e){}
  S=loadState(key); rollDay(); rememberPlayer(key); draft=null; createExtra=false; heroDraft=null;

/* ---- "Are you sure?" before any ember is spent ---- */
function askSure(what,cost,go){
  const old=document.getElementById('cfm'); if(old) old.remove();
  const d=document.createElement('div'); d.id='cfm'; d.className='cfm';
  d.innerHTML=`<div class="cfm-in" role="alertdialog" aria-modal="true" aria-label="Are you sure?"><h3>Are you sure?</h3><p>Spend <b>${cost}</b> embers on <b>${esc(what)}</b>?</p><p class="cfm-sub">You have ${S.embers}. You would have ${Math.max(0,S.embers-cost)} left.</p><div class="cfm-row"><button class="btn" data-cfm="no">No, go back</button><button class="btn" data-cfm="yes">Yes, buy it</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('[data-cfm="no"]').onclick=()=>{ d.remove(); Audio_.fx('tap'); };
  d.querySelector('[data-cfm="yes"]').onclick=()=>{ d.remove(); go(); };
  d.addEventListener('click',e=>{ if(e.target===d) d.remove(); });
  d.querySelector('[data-cfm="no"]').focus();
}

let shopTab='treats';
function openShop(){
  SHEET='shop';
  const tabs=[['treats','Treats'],['decor','Island'],['build','Buildings'],['acc','Dress-up']];
  const list=CATALOG[shopTab].filter(x=>(!x.event||eventActive(x.event))&&!x.own);
  const cards=list.map(it=>{
    let btn='';
    const cst=costOf(shopTab,it),buyBtn=`<button class="btn btn-primary btn-sm" data-act="buy" data-id="${it.id}" ${S.embers>=cst?'':'disabled'}>${ic('ember',16)} ${cst}</button>`;
    if(shopTab==='treats') btn=buyBtn;
    else if(shopTab==='decor') btn=S.inv.decor.includes(it.id)?`<span class="own">On your island</span>`:buyBtn;
    else if(shopTab==='build') btn=built(it.id)?`<span class="own">Built</span>`:buyBtn;
    else btn=S.inv.acc.includes(it.id)?`<button class="btn btn-sm" data-act="wear" data-id="${it.id}" data-slot="${it.slot}">${(S.dragon.gear||{})[it.slot]===it.id?'Take off':'Wear'}</button>`:buyBtn;
    return `<div class="card">${catalogIcon(shopTab,it)}<b>${it.name}</b><small>${it.note}${shopTab==='treats'?` You have ${S.inv[it.id]}.`:''}</small>${btn}</div>`;
  }).join('');
  const hint=shopTab==='build'?`<p class="sub">New buildings appear on the island where you see a staked-out plot.${built('forge')?'':' The forge unlocks metal armour.'}${built('stables')?'':' The stables make room for more dragons.'}${built('clothes')?'':' The clothes shop sells outfits and gear for you.'} The newer buildings go on the Village Green: tap Map, then Village Green.</p>`:shopTab==='decor'?`<p class="sub">Look for the plots to see where each one goes. Autumn things go on the Village Green. Millie and hen items show up on Millie and at the coop.</p>`:'';
  openSheet(`<div class="row spread"><h2>Market</h2><div class="row"><span class="pill gold num">${ic('ember',18)} ${S.embers}</span><button class="btn btn-ghost btn-sm" data-act="close">${ic('close',18)} Close</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-act="shoptab" data-k="${k}" aria-selected="${shopTab===k}">${l}</button>`).join('')}</div>${hint}<div class="shop">${cards}</div>`,{wide:true});
}
function spendAndGive(tab,it){
  if(!it||S.embers<costOf(tab,it)) return false;
  if(tab==='decor'&&S.inv.decor.includes(it.id)) return false; if(tab==='build'&&built(it.id)) return false;
  if((tab==='acc'||tab==='forge')&&S.inv.acc.includes(it.id)) return false;
  S.embers-=costOf(tab,it); Audio_.fx('buy');
  if(tab==='treats') S.inv[it.id]=(S.inv[it.id]||0)+1;
  else if(tab==='decor') S.inv.decor.push(it.id);
  else if(tab==='build') S.inv.built.push(it.id);
  else { S.inv.acc.push(it.id); (S.dragon.gear||(S.dragon.gear={}))[it.slot]=it.id; }
  saveState(); villageRefresh(); return true;
}
function buy(id){
  const it=CATALOG[shopTab].find(x=>x.id===id); if(!spendAndGive(shopTab,it)) return;
  reopenSheet();
  toast(shopTab==='build'?`${it.name}: built! Go and look at it.`:`${it.name}: yours!`);
}

function swapDragon(k){

/* ---- grown-ups ---- */
function itemLabel(it){ return it.kind==='bond'?`${it.a}+?`:it.kind==='add'||it.kind==='wadd'?`${it.x}+${it.y}`:it.kind==='tadd'?`${it.T}+${it.u}`:it.kind==='sub'?`${it.n}−${it.m}`:it.kind==='tsub'?`${it.c}−${it.u}`:it.kind==='wsub'?`${it.c}−?`:`fam ${it.x}+${it.y}`; }
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function fmtS(ms){ if(ms==null) return '–'; const s=Math.round(ms/1000); return s<90?`${s}s`:`${Math.round(s/60)} min`; }
function faceWord(v){return v===3?'good':v===2?'okay':v===1?'worried':'no answer';}

/* ---- grown-ups gate: hold the lock for a second, or answer a grown-up sum ---- */
let GATE={a:0,b:0,ans:0};
function openGate(){
  const a=pick([13,14,16,17,18,19]), b=pick([6,7,8,9]); GATE={a,b,ans:a*b};
  openSheet(`<div class="row spread"><h2>Grown-ups</h2><button class="btn btn-ghost btn-sm" data-act="close">${ic('close',18)} Close</button></div>

    <div class="center"><div style="font-size:2rem;font-weight:700;margin:6px 0">${a} &times; ${b} = ?</div>
    <input class="field" id="gans" inputmode="numeric" pattern="[0-9]*" maxlength="4" style="max-width:180px;text-align:center;font-size:1.6rem" autocomplete="off" aria-label="Answer">
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn btn-primary" data-act="gate-go">Open</button></div></div>`);
  const i=$('#gans'); if(i){ i.focus(); i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=$('[data-act="gate-go"]'); if(b) b.click(); } }); }
}
function openGrownups(tab){
  tab=tab||'progress';
  const ss=S.sessions.filter(s=>!s.partial&&!s.bonus), last=ss.slice(-10);
  const secureN=ALL_ITEMS.filter(it=>isSecure(it.id)).length, seenN=ALL_ITEMS.filter(it=>isSeen(it.id)).length;
  /* 1 calmer starts */
  const fa=last.map(s=>s.firstAnswerMs).filter(x=>x!=null), de=last.map(s=>s.startDelayMs).filter(x=>x!=null);
  const faces=[1,2,3].map(v=>last.filter(s=>s.faceStart===v).length);
  const bars=last.length?`<div class="barline" role="img" aria-label="Seconds to first answer, last sessions">${last.map(s=>{const sec=s.firstAnswerMs==null?0:Math.min(120,s.firstAnswerMs/1000);return `<i style="height:${Math.max(4,sec/120*100)}%"><span>${s.firstAnswerMs==null?'–':Math.round(s.firstAnswerMs/1000)}</span></i>`;}).join('')}</div>`:'<p class="note">Shows after the first session.</p>';
  const calm=`<div class="box"><h3>Calmer starts</h3><p class="note">Seconds from the first question appearing to their first answer. Lower and steadier is calmer. Also how they said maths felt before starting.</p>${bars}
     <table><tr><th>Typical time to first answer</th><td>${fmtS(median(fa))}</td></tr><tr><th>Typical wait before starting</th><td>${fmtS(median(de))}</td></tr><tr><th>Felt at the start</th><td>${faces[2]} good, ${faces[1]} okay, ${faces[0]} worried</td></tr></table></div>`;
  /* 2 hard moments */
  const hA=last.reduce((a,s)=>a+(s.hardAsked||0),0), hT=last.reduce((a,s)=>a+(s.hardTry||0),0), hG=last.reduce((a,s)=>a+(s.hardGuess||0),0), hAll=hA+hT+hG;
  const pct=n=>hAll?Math.round(n/hAll*100):0;
  const hard=`<div class="box"><h3>When a question gets hard</h3><p class="note">What they did at the first sign of difficulty over the last ${last.length||0} sessions. Asking for help and trying again are the goals. Quick guessing is the thing to see fall.</p>
    <table><tr><th>Pressed "Not sure yet"</th><td class="num">${hA} (${pct(hA)}%)</td></tr><tr><th>Tried again with the tools</th><td class="num">${hT} (${pct(hT)}%)</td></tr><tr><th>Quick guess</th><td class="num">${hG} (${pct(hG)}%)</td></tr></table>
    ${hAll<6?'<p class="note">Too few hard moments so far to see a pattern.</p>':''}</div>`;
  /* 3 retention */
  const rev=S.log.filter(l=>l.gap!=null&&l.gap>=6&&l.kind==='train'), revOk=rev.filter(l=>l.clean).length;
  const snaps=S.snaps.slice(-14), mx=Math.max(1,ALL_ITEMS.length*.5, ...snaps.map(x=>x.secure));
  const trend=snaps.length?`<div class="barline" role="img" aria-label="Facts known after a week, by day">${snaps.map(x=>`<i style="height:${Math.max(4,x.secure/mx*100)}%;background:var(--moss)"><span>${x.secure}</span></i>`).join('')}</div>`:'';
  const ret=`<div class="box"><h3>Still known after a week</h3><p class="note">A fact counts as secure once they got it right unaided at a review about a week after learning it.</p>${trend}
    <table><tr><th>Facts secure now</th><td class="num">${secureN} of ${ALL_ITEMS.length} (${seenN} met so far)</td></tr>
    <tr><th>Right without help, 6+ days later</th><td class="num">${rev.length>=5?`${Math.round(revOk/rev.length*100)}% of ${rev.length} reviews`:`Needs about 5 reviews (${rev.length} so far)`}</td></tr></table></div>`;
  /* tools */
  const tl={counters:[0,0],line:[0,0],none:[0,0]}; S.log.filter(l=>l.kind==='train'&&l.tool&&tl[l.tool]).forEach(l=>{tl[l.tool][0]++; if(l.clean) tl[l.tool][1]++;});
  const tools=`<div class="box"><h3>Which method is working</h3><p class="note">Right first time, by the way they worked it out. Small numbers early on, so treat this as a hint only.</p>
    <table>${[['counters','Counters and ten-frames'],['line','Number line'],['none','Just knew it']].map(([k,l])=>`<tr><th>${l}</th><td class="num">${tl[k][0]?`${Math.round(tl[k][1]/tl[k][0]*100)}% of ${tl[k][0]}`:'–'}</td></tr>`).join('')}</table></div>`;
  /* facts */
  const facts=SKILLS.map((sk,i)=>{const p=skillStats(i); return `<div class="box"><h3>${sk.name}</h3><p class="note">${sk.blurb} ${skillUnlocked(i)?'':'<b>Locked until the one before is going well.</b>'} Secure: ${p.secure} of ${p.n}.</p><div class="facts">${sk.items.map(it=>{const b=boxOf(it.id);return `<span class="fact ${b>=0?'b'+b:''}" title="${b>=0?'Box '+b:'Not met yet'}">${itemLabel(it)}</span>`;}).join('')}</div></div>`;}).join('');
  const legend=`<div class="legend"><span class="fact">not met</span><span class="fact b0">needs help</span><span class="fact b1">learning</span><span class="fact b3">secure after a week</span></div>`;
  /* settings */
  const sel=(k,opts,cur)=>`<select data-set="${k}">${opts.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  const backup=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const settings=`<div class="box"><h3>Settings</h3>
    <div class="setrow"><span>Sound effects</span><button class="btn btn-sm" data-act="gset" data-k="sfx" aria-pressed="${S.settings.sfx}">${S.settings.sfx?'On':'Off'}</button></div>
    <div class="setrow"><span>Music (off by default, school notes noise can distract)</span><button class="btn btn-sm" data-act="gset" data-k="music" aria-pressed="${S.settings.music}">${S.settings.music?'On':'Off'}</button></div>
    <div class="setrow"><span>Island (bridge, flying, shards) opens without practice first. To switch or add a player, tap the name at the top left of the island</span><button class="btn btn-sm" data-act="gset" data-k="exploreAny" aria-pressed="${S.settings.exploreAny}">${S.settings.exploreAny?'On':'Off'}</button></div>
    <div class="setrow"><span>Volume</span><input type="range" min="0" max="100" value="${Math.round(S.settings.vol*100)}" data-set="vol" aria-label="Volume"></div>
    <div class="setrow"><span>Questions in a training session</span>${sel('sessionMax',[[8,'8 (short)'],[10,'10'],[12,'12']],S.settings.sessionMax)}</div>
    <div class="setrow"><span>New facts per day</span>${sel('newPerDay',[[2,'2'],[3,'3'],[4,'4']],S.settings.newPerDay)}</div>
    <div class="setrow"><span>Dragon Dash clock</span>${sel('dashMode',[['calm','Never offer a clock'],['choice','Let the child choose a gentle clock']],S.settings.dashMode)}</div>
    <div class="setrow"><span>Start from</span>${sel('startSkill',SKILLS.map((s,i)=>[i,s.name]),S.startSkill)}</div></div>`;
  const tips=`<div class="box"><h3>Sitting alongside</h3><ul style="margin:0;padding-left:1.2em;display:grid;gap:4px"><li>Ask "What is your first step?" before you say anything else.</li><li>Praise the strategy ("you made ten first") more than the answer.</li><li>If they ask for help, treat it as a smart move.</li><li>"You have not learned this securely yet" is kinder and truer than "you got it wrong".</li><li>Stop on a win. Ten minutes is plenty.</li></ul></div>`;
  const soon=`<div class="box"><h3>Planned next</h3><div class="soon">${LATER_SKILLS.map(([a,b])=>`<div>${ic('lock',16)}<span><b>${a}</b>. ${b}</span></div>`).join('')}</div></div>`;
  const bk=`<div class="box"><h3>Save code (move to another device)</h3><p class="note">This saves the current player (${esc((S.hero&&S.hero.name)||S.dragon.name)}) only. Progress lives in this browser. To move to another device, copy the save code, then paste it into "Restore" on the new device. Do this every few weeks as a backup too.</p>
    <textarea readonly id="bk" aria-label="Backup code">${backup}</textarea><div class="row"><button class="btn btn-sm" data-act="copy-bk">Copy save code</button></div>
    <textarea id="rs" aria-label="Paste a backup code to restore" placeholder="Paste a backup code here"></textarea><div class="row"><button class="btn btn-sm" data-act="restore">Restore from code</button><button class="btn btn-sm btn-ghost" data-act="reset-all" id="rsall">Erase this player</button></div></div>`;
  const tabs=[['progress','Progress'],['facts','Facts'],['settings','Settings']];
  const body=tab==='progress'?`<div class="grid2">${calm}${hard}${ret}${tools}</div>${tips}${soon}`:tab==='facts'?`${legend}<div class="grid2">${facts}</div>`:`<div class="grid2">${settings}${bk}</div>`;
  openSheet(`<div class="row spread"><h2>Grown-ups</h2><button class="btn btn-ghost btn-sm" data-act="close">${ic('close',18)} Close</button></div>
    <p class="sub">${esc((S.hero&&S.hero.name)||S.dragon.name)} has trained ${S.days.length} day${S.days.length===1?'':'s'} and played ${S.dash.plays.length} Dash${S.dash.plays.length===1?'':'es'}. ${storageOK?'':'<span class="warn">Saving is blocked in this browser, so use the backup code.</span>'}</p>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-act="gtab" data-k="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div><div class="gu">${body}</div>`,{wide:true});
}
function applySetting(k,v){
  const s=S.settings;
  if(k==='vol'){ s.vol=v/100; Audio_.setVol(s.vol); }
  else if(k==='startSkill'){ S.startSkill=+v; }
  else if(k==='dashMode'){ s.dashMode=v; }
  else s[k]=+v;
  saveState();
}

/* hold-to-open for grown-ups */
let holdT=null, holdOpenedAt=0;
function holdStart(btn){ const i=btn.querySelector('i'); if(i){i.style.transition='width 1.2s linear'; i.style.width='100%';} holdT=setTimeout(()=>{holdT=null; if(i){i.style.transition='none';i.style.width='0';} holdOpenedAt=Date.now(); openGrownups();},1200); }
function holdStop(btn){ if(holdT){clearTimeout(holdT);holdT=null;} const i=btn&&btn.querySelector('i'); if(i){i.style.transition='width .2s';i.style.width='0';} }
document.addEventListener('contextmenu',e=>{ if(e.target.closest&&e.target.closest('#holdgu')) e.preventDefault(); });
document.addEventListener('pointerdown',e=>{const b=e.target.closest('#holdgu'); if(b) holdStart(b);});
['pointerup','pointerleave','pointercancel'].forEach(t=>document.addEventListener(t,e=>{const b=e.target.closest&&e.target.closest('#holdgu'); if(b) holdStop(b);},true));
document.addEventListener('keydown',e=>{
  if(screen==='village'&&!e.target.closest('#holdgu')){ if(Village.onKey(e)){ e.preventDefault(); return; } }
  const b=e.target.closest&&e.target.closest('#holdgu'); if(b&&(e.key==='Enter'||e.key===' ')&&!e.repeat){holdStart(b);e.preventDefault();return;}
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  if($('#overlay').children.length) { if(e.key==='Escape'&&!$('.sheet [data-act="tutorial-go"]')) closeSheet(); return; }
  if(screen==='question'&&Q){
    if(/^[0-9]$/.test(e.key)){ if(!Q.done&&!Q.locked&&Q.answer.length<2){ setAnswer(Q.answer+e.key); Audio_.fx('tap'); } e.preventDefault(); }
    else if(e.key==='Backspace'){ if(!Q.done) setAnswer(Q.answer.slice(0,-1)); e.preventDefault(); }
    else if(e.key==='Enter'){ if(Q.done) afterQuestion(); else submitAnswer(); e.preventDefault(); }
  }else if(screen==='dash'&&DASH){
    if(/^[0-9]$/.test(e.key)&&!DASH.locked&&DASH.ans.length<2){ DASH.ans+=e.key; renderDash(); if(DASH.ans.length===String(DASH.q.ans).length) setTimeout(dashAnswer,220); e.preventDefault(); }
    else if(e.key==='Backspace'&&!DASH.locked){ DASH.ans=DASH.ans.slice(0,-1); renderDash(); e.preventDefault(); }
    else if(e.key==='Enter'){ dashAnswer(); e.preventDefault(); }
  }
});
document.addEventListener('keyup',e=>{ if(screen==='village') Village.onKeyUp(e); const b=e.target.closest&&e.target.closest('#holdgu'); if(b) holdStop(b);});

/* ---- boot ---- */
S=loadState(); rollDay();
window.EmberIsle={Village,act:(a,d={})=>{const el=document.createElement('button');el.dataset.act=a;Object.assign(el.dataset,d);document.body.appendChild(el);el.click();el.remove();},state:()=>S,setToday:d=>{TODAY_OVERRIDE=d;rollDay();},save:saveState,ITEM,SKILLS,buildPlan,dueItems,applyResult,makeQ,Q:()=>Q,SESS:()=>SESS,DASH:()=>DASH,goHome,openGrownups,fresh:()=>{S=freshState();draft=null;}};
Village.preload();
{ const profs=listProfiles();
  if(!profs.length){ SAVE_KEY=SLOTS[0]; showSplash(null,()=>startNewPlayer(SLOTS[0])); }
  else if(profs.length===1){ S=loadState(profs[0].key); rollDay(); showSplash(S.hero&&S.hero.done?S.hero.name:null,()=>enterGame()); }
  else { const last=lastPlayed(); S=loadState(profs.some(p=>p.key===last)?last:profs[0].key); rollDay(); showSplash(null,()=>renderWho()); } }


})();
</script>
