<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4f55"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Isle of Ru"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Isle of Ru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout concept: one calm full-height stage. Home is an island scene with a few big buttons.
   Training is a two-column desk: tools on the left, the question and keypad on the right. */
:root{
  --bg:#c9d2cf; --bg2:#b7c4c1; --surface:#f6ecd5; --surface2:#ecdfc0; --ink:#2a2118; --ink2:#5b4d3b; --line:#b79d6c;
  --wood:#6a4a28; --wood2:#8d6a3d; --iron:#3a4650;
  --tide:#2c6a72; --tide2:#22545b; --tide-ink:#ffffff; --ember:#d9531e; --gold:#e8a935; --moss:#4a7c3f; --plum:#6f4a8e;
  --unit:#d9531e; --ten:#2f62b8; --hund:#3f8a4a;
  --good:#2b7447; --good-bg:#dcebd0; --soft:#9a5a0a; --soft-bg:#f6e1b0; --info-bg:#dde8e3;
  --sky1:#5a7d92; --sky2:#f1c98a; --sea1:#3f6f80; --sea2:#1d3f50; --grass:#6f9a52; --grass2:#4d7a3f; --rock:#7d8a8c; --rock2:#566267; --sand:#cdb98a;
  --sun-op:1; --moon-op:0; --star-op:0; --cloud:#e9e1d0; --mist:#e8e4d8;
  --shadow:0 6px 18px rgba(42,33,24,.22);
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-title:'Cinzel','Trajan Pro',Georgia,serif;
  --font-body:'Lexend',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1519; --bg2:#141d22; --surface:#1c2529; --surface2:#222d32; --ink:#f0e8d6; --ink2:#b9ae98; --line:#5a4730;
    --wood:#8a6a3e; --wood2:#a8854f; --iron:#7d8c97;
    --tide:#5bb3ba; --tide2:#86cdd2; --tide-ink:#06242a; --ember:#ff8248; --gold:#ffcb5c; --moss:#86b872; --plum:#c39be2;
    --good:#8fd6a0; --good-bg:#1a3a28; --soft:#ffc766; --soft-bg:#3d2f10; --info-bg:#17303a;
    --sky1:#0f1a2c; --sky2:#6a4e62; --sea1:#1e4b60; --sea2:#0d2a3a; --grass:#4a7a46; --grass2:#38603a; --rock:#4f5c63; --rock2:#3b464c; --sand:#7d6f4f;
    --sun-op:0; --moon-op:1; --star-op:1; --cloud:#6f6f92; --mist:#8d93ad;
    --shadow:0 6px 22px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1519; --bg2:#141d22; --surface:#1c2529; --surface2:#222d32; --ink:#f0e8d6; --ink2:#b9ae98; --line:#5a4730;
  --wood:#8a6a3e; --wood2:#a8854f; --iron:#7d8c97;
  --tide:#5bb3ba; --tide2:#86cdd2; --tide-ink:#06242a; --ember:#ff8248; --gold:#ffcb5c; --moss:#86b872; --plum:#c39be2;
  --good:#8fd6a0; --good-bg:#1a3a28; --soft:#ffc766; --soft-bg:#3d2f10; --info-bg:#17303a;
  --sky1:#0f1a2c; --sky2:#6a4e62; --sea1:#1e4b60; --sea2:#0d2a3a; --grass:#4a7a46; --grass2:#38603a; --rock:#4f5c63; --rock2:#3b464c; --sand:#7d6f4f;
  --sun-op:0; --moon-op:1; --star-op:1; --cloud:#6f6f92; --mist:#8d93ad;
  --shadow:0 6px 22px rgba(0,0,0,.5);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-title);font-weight:700;letter-spacing:.02em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{display:inline-block;vertical-align:-.2em;flex:none}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding-block:12px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{border-bottom-width:4px!important;box-shadow:0 2px 0 rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.55em 1.3em;border-radius:16px;font-weight:600;
  font-size:1rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);transition:transform .12s ease,background .15s ease,border-color .15s ease;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{border-color:var(--tide)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--tide);color:var(--tide-ink);border-color:var(--tide);font-family:var(--font-display);font-size:1.2rem;letter-spacing:.01em}
.btn-primary:hover{background:var(--tide2);border-color:var(--tide2)}
.btn-ember{background:var(--ember);color:#fff;border-color:var(--ember);font-family:var(--font-display);font-size:1.25rem}
.btn-ember:hover{filter:brightness(1.06);border-color:var(--ember)}
.btn-soft{background:var(--soft-bg);border-color:transparent;color:var(--ink)}
.btn-soft:hover{border-color:var(--gold)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2);border-color:var(--line)}
.btn-big{min-height:68px;font-size:1.45rem;padding:.5em 1.8em;border-radius:22px}
.btn-sm{min-height:42px;padding:.3em .9em;font-size:.9rem;border-radius:12px}
.btn-icon{min-width:52px;padding:.4em}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.3em .8em;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:.95rem}
.pill .ic{color:var(--ember)}
.pill.gold .ic{color:var(--gold)}

/* create dragon */
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;padding:12px 4px}
.create .preview{background:radial-gradient(120% 90% at 50% 20%,var(--sky2),var(--sky1));border-radius:28px;min-height:360px;display:grid;place-items:center;padding:16px;box-shadow:var(--shadow)}
.create .preview svg{width:min(340px,70%);height:auto}
.create .btn{white-space:nowrap}
.opt{margin-bottom:14px}
.opt h3{font-size:1.05rem;margin-bottom:8px;color:var(--ink2);font-family:var(--font-body);font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:.4em 1em;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:500;min-height:44px}
.chip[aria-pressed="true"]{background:var(--tide);color:var(--tide-ink);border-color:var(--tide)}
.field{width:100%;font:inherit;font-size:1.3rem;font-family:var(--font-display);padding:.45em .8em;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:54px}

/* home scene */
.stage{position:relative;flex:1;min-height:520px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:var(--sky1)}
.stage>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.hud-l,.hud-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nameplate{background:var(--surface);border-radius:16px;padding:.35em .9em;border:2px solid var(--line);box-shadow:var(--shadow)}
.nameplate b{font-family:var(--font-display);font-size:1.25rem;display:block;line-height:1.1}
.nameplate span{font-size:.8rem;color:var(--ink2)}
.dock{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 14px}
.bubble{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:.55em 1.1em;border-radius:18px;font-weight:500;box-shadow:var(--shadow);max-width:min(440px,86%);text-align:center;border:2px solid var(--line)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.footlinks{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 0;color:var(--ink2);font-size:.9rem;gap:10px;flex-wrap:wrap}
.hit{cursor:pointer}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.1)}}
.cloud{animation:drift 26s ease-in-out infinite alternate}
.cloud.c2{animation-duration:34s;animation-direction:alternate-reverse}
.waves{animation:wave 9s linear infinite}
.dragon-bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.flame{animation:flick .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.heart{position:absolute;pointer-events:none;color:#ff6b8b;animation:floatup 1.3s ease-out forwards;font-size:30px}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-90px) scale(1.2)}}

/* sheets / modal */
.veil{position:fixed;inset:0;background:rgba(8,20,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fadein .2s ease}
.sheet{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);width:min(780px,100%);max-height:92vh;overflow:auto;padding:22px 24px;border:2px solid var(--line)}
.sheet.wide{width:min(980px,100%)}
.sheet h2{font-size:1.7rem;margin-bottom:6px}
.sheet .sub{color:var(--ink2);margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:.45em 1.1em;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;min-height:46px}
.tab[aria-selected="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.tab .star{color:var(--gold);margin-left:.3em}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.card>svg{width:84px;height:84px}
.card b{font-family:var(--font-display);font-size:1.1rem}
.card small{color:var(--ink2);min-height:2.6em}
.card .own{color:var(--good);font-weight:600}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.pips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pip{width:26px;height:10px;border-radius:99px;background:var(--line);transition:background .3s,transform .3s}
.pip.done{background:var(--moss)}
.pip.help{background:var(--gold)}
.pip.now{background:var(--tide);transform:scaleY(1.4)}
.desk{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:18px;flex:1;min-height:0}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.story{font-size:1.2rem;line-height:1.5}
.story b{font-family:var(--font-display);font-size:1.35em;color:var(--tide);padding:0 .08em}
.eq{display:flex;align-items:center;justify-content:center;gap:.35em;font-family:var(--font-display);font-size:clamp(2.2rem,4.6vw,3.4rem);font-weight:600;flex-wrap:wrap;padding:6px 0}
.eq .op{color:var(--ink2)}
.eq .slot-ans{min-width:2.1em;height:1.45em;border-radius:14px;border:3px dashed var(--tide);display:inline-flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--tide)}
.eq .slot-ans.has{border-style:solid}
.eq-sub{text-align:center;color:var(--ink2);font-size:1.05rem}
.fb{min-height:62px;border-radius:16px;padding:.6em 1em;font-weight:500;display:flex;align-items:center;gap:.6em;background:var(--surface2);color:var(--ink2);line-height:1.35}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.soft{background:var(--soft-bg);color:var(--soft)}
.fb.info{background:var(--info-bg);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .btn{min-height:58px;font-size:1.5rem;font-family:var(--font-display);padding:.2em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tool-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:280px}
.tool-note{text-align:center;color:var(--ink2);min-height:1.5em;font-size:1rem;margin-top:8px}
.tool-note b{color:var(--ink)}
.tf-pair{display:flex;gap:22px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.tf-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.tf-cap{font-weight:600;color:var(--ink2);font-size:.95rem;min-height:1.4em}
.tf-frame{display:grid;grid-template-columns:repeat(5,var(--cell,52px));gap:7px;padding:10px;border-radius:16px;background:var(--surface2);border:3px solid var(--line);position:relative;transition:box-shadow .3s,border-color .3s}
.tf-frame.glow{border-color:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 35%,transparent)}
.tf-frame.full{border-color:var(--moss)}
.tf-frame.dim{opacity:.35}
.slot{width:var(--cell,52px);height:var(--cell,52px);border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;position:relative;touch-action:manipulation}
.slot.tap{cursor:pointer}
.slot.tap:hover{border-color:var(--tide);background:var(--info-bg)}
.ct{width:84%;height:84%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--unit) 55%,#fff),var(--unit) 55%,color-mix(in srgb,var(--unit) 75%,#000));box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 -3px 5px rgba(0,0,0,.15);cursor:pointer;transition:transform .15s ease,opacity .25s}
.ct:hover{transform:scale(1.07)}
.ct.added{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 60%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 70%,#000))}
.ct.off{opacity:.18;transform:scale(.8)}
.ct.fixed{cursor:default}
.ct.hide{visibility:hidden}
.ct.merge{transform:translate(var(--mx),var(--my)) scale(.2);opacity:0;transition:transform .45s ease-in,opacity .45s}
.fly{position:fixed;z-index:80;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--unit) 55%,#fff),var(--unit) 55%,color-mix(in srgb,var(--unit) 75%,#000));box-shadow:0 6px 12px rgba(0,0,0,.25)}
.fly.gold{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 60%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 70%,#000))}
.ten-token{width:calc(var(--cell,52px)*2.2);height:calc(var(--cell,52px)*2.2);border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:2.2rem;font-weight:600;color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ten) 55%,#fff),var(--ten) 55%,color-mix(in srgb,var(--ten) 70%,#000));box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 -5px 8px rgba(0,0,0,.18);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.line-wrap{width:100%}
.line-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.nl-tick{stroke:var(--ink2);stroke-width:2}
.nl-ten{stroke:var(--ten);stroke-width:4}
.nl-lab{fill:var(--ink2);font-family:var(--font-display);font-size:20px;text-anchor:middle}
.nl-lab.ten{fill:var(--ten);font-size:26px;font-weight:600}
.nl-hit{fill:transparent;cursor:pointer}
.nl-hit:hover{fill:color-mix(in srgb,var(--tide) 14%,transparent)}
.nl-arc{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.nl-hoplab{fill:var(--ink);font-family:var(--font-display);font-size:22px;text-anchor:middle;font-weight:600}
.faces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.face{width:116px;padding:14px 8px;border-radius:20px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.face:hover{border-color:var(--tide)}
.face svg{width:54px;height:54px}
.hl{animation:hl 1.2s ease-in-out infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 70%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 0%,transparent)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1;padding:10px}
.hero-dragon svg{width:min(260px,60vw);height:auto}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:10px 18px;min-width:130px}
.stat b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1.1}
.stat span{font-size:.9rem;color:var(--ink2)}
.breathe{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--tide),var(--tide2));margin:18px auto;animation:breath 8s ease-in-out infinite;opacity:.85}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.dash-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.sunbar{flex:1;min-width:140px;height:14px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.sunbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#ff9a4d);border-radius:99px;transition:width .25s linear}
.treats{display:flex;gap:4px;flex-wrap:wrap;min-height:36px}
.treats svg{width:30px;height:30px;animation:pop .35s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6em 1.2em;border-radius:14px;font-weight:500;z-index:90;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* grown-ups */
.gu{display:grid;gap:16px}
.gu h3{font-size:1.25rem;margin-bottom:4px}
.gu .note{color:var(--ink2);font-size:.95rem}
.gu .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.gu .box{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gu table{border-collapse:collapse;width:100%;font-size:.92rem}
.gu th,.gu td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.gu th{color:var(--ink2);font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:5px}

/* ================= audio: soft effects + optional gentle music ================= */
const Audio_={
  ctx:null,master:null,music:null,musicTimer:null,musicOn:false,
  ensure(){
    if(this.ctx) { if(this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}} return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.music=this.ctx.createGain(); this.music.gain.value=1.1; this.music.connect(this.master);
      this.setVol(S.settings.vol); return true;
    }catch(e){return false;}
  },
  setVol(v){ if(this.master) this.master.gain.value=Math.max(0,Math.min(1,v))*0.5; },
  tone(freq,t0,dur,{type='sine',vol=.25,attack=.01,to=null,dest=null}={}){
    const c=this.ctx; if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+attack); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(dest||this.master); o.start(t0); o.stop(t0+dur+.05);
  },
  fx(name){
    if(!S.settings.sfx) return; if(!this.ensure()) return;
    const c=this.ctx, t=c.currentTime;
    try{
      switch(name){
        case 'pop': this.tone(520,t,.12,{type:'sine',vol:.22,to:760}); break;
        case 'tap': this.tone(380,t,.07,{type:'triangle',vol:.14}); break;
        case 'good': [523.25,659.25,783.99].forEach((f,i)=>this.tone(f,t+i*.09,.35,{type:'triangle',vol:.2})); break;
        case 'soft': this.tone(330,t,.22,{type:'sine',vol:.16}); this.tone(294,t+.12,.28,{type:'sine',vol:.14}); break;
        case 'ten': [392,523.25,659.25,880].forEach((f,i)=>this.tone(f,t+i*.07,.4,{type:'sine',vol:.2})); break;
        case 'munch': for(let i=0;i<3;i++) this.tone(180-i*14,t+i*.13,.09,{type:'square',vol:.08,to:100}); break;
        case 'hatch': for(let i=0;i<4;i++) this.tone(900+i*60,t+i*.12,.05,{type:'square',vol:.07}); [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+.6+i*.12,.5,{type:'triangle',vol:.22})); break;
        case 'fanfare': [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.13,.45,{type:'triangle',vol:.22})); break;
        case 'heart': this.tone(700,t,.15,{type:'sine',vol:.15,to:1000}); this.tone(1000,t+.1,.2,{type:'sine',vol:.12}); break;
        case 'buy': [660,880].forEach((f,i)=>this.tone(f,t+i*.08,.25,{type:'triangle',vol:.18})); break;
      }
    }catch(e){}
  },
  startMusic(){
    if(this.musicOn) return; if(!this.ensure()) return; this.musicOn=true;
    const c=this.ctx;
    if(!this.rev){ try{ this.rev=NORSE.makeReverb(c); this.music.connect(this.rev.in); this.rev.out.connect(this.master); }catch(e){} }
    this.A={ctx:c,dest:this.music,noise:NORSE.noiseBuf(c)};
    this.bar=0; this.nextT=c.currentTime+.2;
    const tick=()=>{ if(!this.musicOn||!S.settings.music||!this.ctx) return; while(this.nextT<c.currentTime+2.2){ try{ NORSE.bar(this.A,this.nextT,this.bar); }catch(e){} this.nextT+=NORSE.BAR; this.bar++; } };
    tick(); this.musicTimer=setInterval(tick,500);
  },
  stopMusic(){ this.musicOn=false; if(this.musicTimer){clearInterval(this.musicTimer);this.musicTimer=null;} },
  syncMusic(){ if(S.settings.music) this.startMusic(); else this.stopMusic(); }
};

/* ================= an original folk-style Nordic theme, built from oscillators =================
   6/8, D Dorian. A and B sections of 8 bars each. Soft whistle melody, plucked harp, string pad, a low drone,
   a gentle frame drum, and a fiddle joining in the second half. Everything is quiet and slow on purpose. */
const NORSE=(()=>{
  const E=60/70/3, BAR=E*6, f=n=>293.66*Math.pow(2,n/12);
  const CH={Dm:[146.83,174.61,220.0,73.42],Bb:[116.54,146.83,174.61,58.27*2],F:[174.61,220.0,261.63,87.31],C:[130.81,164.81,196.0,65.41*2],Gm:[196.0,233.08,293.66,98.0]};
  const PROG_A=['Dm','Bb','F','C','Dm','Bb','C','Dm'], PROG_B=['Gm','Dm','Bb','F','Gm','Dm','C','Dm'];
  const MEL_A=[[[7,3],[5,1],[3,1],[2,1]],[[3,3],[5,2],[7,1]],[[10,3],[7,1],[5,1],[3,1]],[[2,2],[5,1],[7,3]],[[12,3],[10,1],[7,1],[5,1]],[[3,1],[5,1],[7,1],[10,3]],[[12,2],[10,1],[7,2],[5,1]],[[5,2],[2,1],[0,3]]];
  const MEL_B=[[[14,3],[12,1],[10,1],[7,1]],[[12,3],[10,2],[7,1]],[[15,3],[12,1],[10,1],[12,1]],[[15,2],[12,1],[10,3]],[[19,3],[17,1],[15,1],[14,1]],[[12,2],[14,1],[12,2],[10,1]],[[10,3],[7,1],[5,1],[2,1]],[[7,2],[2,1],[0,3]]];
  function noiseBuf(c){ const n=c.sampleRate*.6, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
  function makeReverb(c){
    const len=Math.floor(c.sampleRate*2.6), b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    const conv=c.createConvolver(); conv.buffer=b; const inp=c.createGain(), wet=c.createGain(); wet.gain.value=.34; inp.connect(conv); conv.connect(wet); return {in:inp,out:wet};
  }
  function env(g,t,a,dur,rel,vol){ g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.setValueAtTime(vol,t+Math.max(a,dur-.02)); g.gain.exponentialRampToValueAtTime(.0001,t+dur+rel); }
  function whistle(A,t,fr,dur,vol){
    const c=A.ctx,g=c.createGain(),o1=c.createOscillator(),o2=c.createOscillator(),m=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    o1.type='sine'; o2.type='triangle'; o1.frequency.value=fr; o2.frequency.value=fr; m.gain.value=.25;
    lfo.frequency.value=5.2; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(fr*.008,t+Math.min(.5,dur)); lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    env(g,t,.07,dur,.28,vol); o1.connect(g); o2.connect(m); m.connect(g); g.connect(A.dest);
    for(const o of [o1,o2,lfo]){ o.start(t); o.stop(t+dur+.4); }
  }
  function fiddle(A,t,fr,dur,vol){
    const c=A.ctx,g=c.createGain(),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=.6; env(g,t,.13,dur,.3,vol); lp.connect(g); g.connect(A.dest);
    for(const dt of [-7,7]){ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.detune.value=dt; const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=5.6; lg.gain.value=fr*.006; l.connect(lg); lg.connect(o.frequency); o.connect(lp); o.start(t); l.start(t); o.stop(t+dur+.5); l.stop(t+dur+.5); }
  }
  function pluck(A,t,fr,vol){
    const c=A.ctx,g=c.createGain(),o=c.createOscillator(),o2=c.createOscillator(),m=c.createGain(); o.type='triangle'; o2.type='sine'; o.frequency.value=fr; o2.frequency.value=fr*2; m.gain.value=.3;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+1.1); o.connect(g); o2.connect(m); m.connect(g); g.connect(A.dest); o.start(t); o2.start(t); o.stop(t+1.2); o2.stop(t+1.2);
  }
  function pad(A,t,fr,dur,vol){
    const c=A.ctx,g=c.createGain(),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; env(g,t,.9,dur,1.3,vol); lp.connect(g); g.connect(A.dest);
    for(const dt of [-5,5]){ const o=c.createOscillator(); o.type='triangle'; o.frequency.value=fr; o.detune.value=dt; o.connect(lp); o.start(t); o.stop(t+dur+1.5); }
  }
  function drone(A,t,vol){
    const c=A.ctx,g=c.createGain(); env(g,t,.8,BAR+.2,1.4,vol); g.connect(A.dest);
    for(const [fr,ty,k] of [[73.42,'sine',1],[110,'sine',.7],[146.83,'triangle',.35]]){ const o=c.createOscillator(),m=c.createGain(); o.type=ty; o.frequency.value=fr; m.gain.value=k; o.connect(m); m.connect(g); o.start(t); o.stop(t+BAR+1.8); }
  }
  function drum(A,t,vol){
    const c=A.ctx,o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(58,t+.16); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(A.dest); o.start(t); o.stop(t+.35);
    const n=c.createBufferSource(),bp=c.createBiquadFilter(),ng=c.createGain(); n.buffer=A.noise; bp.type='bandpass'; bp.frequency.value=220; bp.Q.value=.8; ng.gain.setValueAtTime(vol*.55,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.12); n.connect(bp); bp.connect(ng); ng.connect(A.dest); n.start(t); n.stop(t+.15);
  }
  function bar(A,t0,b){
    const sec=Math.floor(b/8)%2, i=b%8, name=(sec?PROG_B:PROG_A)[i], ch=CH[name], intro=b<4, cyc=b%16;
    drone(A,t0,.05);
    pad(A,t0,ch[0],BAR,.03); pad(A,t0,ch[1],BAR,.028); pad(A,t0,ch[2],BAR,.026);
    const arp=[0,1,2,1,2,1]; for(let k=0;k<6;k++){ pluck(A,t0+k*E,ch[arp[k]]*2,(k===0?.07:.045)*(intro?.7:1)); }
    if(cyc>=4){ drum(A,t0,.17); drum(A,t0+3*E,.11); if(sec){ drum(A,t0+2*E,.05); drum(A,t0+5*E,.05); } }
    const mel=(sec?MEL_B:MEL_A)[i]; let t=t0;
    for(const [n,d] of mel){ const dur=d*E; whistle(A,t,f(n),dur*.97,.075); if(sec||b>=8) fiddle(A,t,f(n-12),dur*.97,.032); t+=dur; }
  }
  return {BAR,bar,noiseBuf,makeReverb};
})();

/* ---- saved state ---- */
let S=null, storageOK=true;
const SCHEMA=3;   /* bump when the saved shape changes, and add a step to migrate() */
let SAVE_LOCKED=false; /* true when the save came from a newer version of the app: never overwrite it */
function freshState(){return {
  v:1, ver:SCHEMA, created:Date.now(), dragon:null, extra:[], hero:null,
  settings:{sfx:true,music:false,vol:0.6,dashMode:'calm',clockOffered:false,exploreAny:false,sessionMax:10,newPerDay:3},
  embers:0, inv:{fish:0,berry:0,spice:0,decor:[],acc:[],wear:null,built:[],closet:[]},

};}
const GEAR_SLOT={scarf:'neck',hat:'head',crown:'head',helm:'head',mail:'body',plate:'body',blade:'tail'};
/* Upgrade an older save to the current shape. Only ever ADD or MOVE things here; never delete a child's progress. */
function migrate(s){
  s.ver=s.ver||1;
  if(s.ver<2){
    s.inv=s.inv||{}; s.inv.built=s.inv.built||[]; s.extra=s.extra||[];
    if(s.dragon){ if(!s.dragon.gear){ s.dragon.gear={}; const w=s.inv.wear; if(w&&GEAR_SLOT[w]) s.dragon.gear[GEAR_SLOT[w]]=w; } if(s.dragon.since==null) s.dragon.since=0; }
    s.ver=2;
  }
  if(s.ver<3){
    s.inv=s.inv||{}; s.inv.closet=s.inv.closet||[];
    if(!s.hero) s.hero={name:'',look:{build:'boy',skin:'#f2c9a0',hair:'#6b3d1e',style:'long',tunic:'#2f8f8d',scarf:'#e8743b'},wear:{},done:false};
    s.ver=3;
  }
  /* future steps: if(s.ver<3){ ...; s.ver=3; } */
  return s;
}
function parseSave(raw){
  try{ const s=JSON.parse(raw); return s&&(s.v===1||s.ver>=1)?s:null; }catch(e){ return null; }
}
function loadState(key){
  if(key) SAVE_KEY=key;
  SAVE_LOCKED=false;
  try{
    const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    const raw=localStorage.getItem(SAVE_KEY);
    storageOK=true;
    if(raw){const s=parseSave(raw);
      if(s){
        const from=s.ver||1;
        if(from>SCHEMA){ SAVE_LOCKED=true; }   /* made by a newer app: leave it alone */
        else if(from<SCHEMA){ try{ localStorage.setItem(SAVE_KEY+'.backup-v'+from,raw); }catch(_){} }
        const base=freshState(); s.ver=from;
        const m=migrate(Object.assign(base,s,{settings:Object.assign(base.settings,s.settings||{}),inv:Object.assign(base.inv,s.inv||{}),day:Object.assign(base.day,s.day||{})}));
        return m;}}
  }catch(e){storageOK=false;}
  return freshState();
}
/* every saved player, read-only: used for the "who is playing" screen and for the other child wandering the island */
function listProfiles(){
  const out=[];
  SLOTS.forEach(key=>{
    let raw=null; try{ raw=localStorage.getItem(key); }catch(e){}
    if(!raw) return; const s=parseSave(raw); if(!s||!s.dragon&&!s.hero) return;
    const from=s.ver||1; let m=s;
    if(from<=SCHEMA){ try{ m=migrate(Object.assign(freshState(),s,{ver:from,inv:Object.assign(freshState().inv,s.inv||{})})); }catch(e){ m=s; } }
    out.push({key,s:m,name:(m.hero&&m.hero.name)||(m.dragon&&m.dragon.name)||'Player',active:key===SAVE_KEY});
  });
  return out;
}
function freeSlot(){ return SLOTS.find(k=>{ try{ return !localStorage.getItem(k); }catch(e){ return false; } }); }
function lastPlayed(){ try{ return localStorage.getItem(META_KEY); }catch(e){ return null; } }
function rememberPlayer(key){ try{ localStorage.setItem(META_KEY,key); }catch(e){} }
function saveState(){
  if(SAVE_LOCKED){ storageOK=false; return; }
  if(S.log.length>1600) S.log=S.log.slice(-1200);
  if(S.sessions.length>400) S.sessions=S.sessions.slice(-300);

}

const ITEM={};
(function buildSkills(){
  const bonds=[5,1,9,2,8,3,7,4,6].map(a=>({id:'b:'+a,kind:'bond',a,ans:10-a}));
  const adds=[]; for(const x of [9,8,7,6]) for(let y=11-x;y<=x;y++) adds.push({id:`a:${x}+${y}`,kind:'add',x,y,ans:x+y});
  const subs=[]; for(let n=11;n<=18;n++) for(let m=n-9;m<=9;m++) subs.push({id:`s:${n}-${m}`,kind:'sub',n,m,ans:n-m,r:m-(n-10)});
  subs.sort((p,q)=>p.r-q.r||p.n-q.n);
  const fams=adds.map(a=>({id:`f:${a.x}+${a.y}`,kind:'fam',x:a.x,y:a.y,c:a.x+a.y,src:a.id,ans:a.y}));
  /* within ten: x+y<=10, no ten involved */
  const wadds=[]; for(let y=2;y<=5;y++) for(let x=y;x<=10-y;x++) wadds.push({id:`w:${x}+${y}`,kind:'wadd',x,y,ans:x+y});
  const wsubs=wadds.map(a=>({id:`v:${a.x}+${a.y}`,kind:'wsub',x:a.x,y:a.y,c:a.x+a.y,src:a.id,ans:a.y}));
  /* teens plus ones, no crossing a ten: totals 14 to 20 */
  const tadds=[]; for(let T=12;T<=18;T++){ const o=T-10; for(let u=(T===18?2:3);u<=10-o;u++) tadds.push({id:`t:${T}+${u}`,kind:'tadd',T,u,o,ans:T+u}); }
  const tsubs=tadds.map(a=>({id:`u:${a.T}+${a.u}`,kind:'tsub',T:a.T,u:a.u,c:a.T+a.u,src:a.id,ans:a.T}));
  SKILLS.push({id:'bonds',name:'Pairs that make ten',blurb:'How many more to fill a ten-frame.',items:bonds});
  SKILLS.push({id:'w10add',easy:true,name:'Adding within ten',blurb:'Join small groups, e.g. 3 + 4.',items:wadds});
  SKILLS.push({id:'w10sub',easy:true,name:'Taking away within ten',blurb:'Use an adding fact to take away, e.g. 7 − 3.',items:wsubs});
  SKILLS.push({id:'make10',name:'Make ten to add',blurb:'Add by filling the ten first, e.g. 8 + 5.',items:adds});
  SKILLS.push({id:'back10',name:'Go back through ten',blurb:'Subtract by stepping back to ten first, e.g. 14 − 6.',items:subs});
  SKILLS.push({id:'family',name:'Fact families',blurb:'Use an adding fact to find the matching take-away.',items:fams});
  SKILLS.push({id:'teenadd',easy:true,name:'Teens plus ones',blurb:'A ten and some ones, e.g. 13 + 4, up to 20.',items:tadds});
  SKILLS.push({id:'teensub',easy:true,name:'Teens take away ones',blurb:'Take ones from a teen number, e.g. 17 − 3.',items:tsubs});
  for(const sk of SKILLS) for(const it of sk.items){it.skill=sk.id; ITEM[it.id]=it;}
})();
const ALL_ITEMS=SKILLS.flatMap(s=>s.items);
const LATER_SKILLS=[
  ['Times tables with arrays','Build grids of counters, doubling and halving.'],
  ['Place value and column methods','Ten-frames grow into tens and hundreds.'],
  ['Fraction strips','Halves, quarters and thirds you can see and compare.'],
  ['Story problems','Turn a story into a picture, then a sum.']
];

const boxOf=id=>S.items[id]?S.items[id].box:-1;
const isSeen=id=>!!S.items[id];
const isSecure=id=>boxOf(id)>=3;
function skillStats(i){
  const its=SKILLS[i].items;
  return {n:its.length, seen:its.filter(x=>isSeen(x.id)).length, steady:its.filter(x=>boxOf(x.id)>=2).length, secure:its.filter(x=>isSecure(x.id)).length};
}
function skillUnlocked(i){
  if(i===0||i<=S.startSkill) return true;
  const p=skillStats(i-1); return p.steady>=Math.ceil(p.n*0.7);
}
function itemEligible(it){ if(!it.src) return true; return boxOf(it.src)>=1; }
function pickNew(count){
  const out=[];
  for(let i=Math.min(S.startSkill,SKILLS.length-1);i<SKILLS.length&&out.length<count;i++){
    if(!skillUnlocked(i)) break;
    for(const it of SKILLS[i].items){ if(out.length>=count) break; if(!isSeen(it.id)&&itemEligible(it)){ out.push(it.id); if(out.length===1&&SKILLS[i].easy) count=Math.max(count,5); } }
  }
  return out;
}
function dueItems(){
  const t=today();
  return ALL_ITEMS.filter(it=>S.items[it.id]&&S.items[it.id].due<=t).sort((a,b)=>S.items[a.id].due.localeCompare(S.items[b.id].due)||S.items[a.id].box-S.items[b.id].box).map(x=>x.id);
}
function easiestKnown(exclude=[]){
  const cands=ALL_ITEMS.filter(it=>isSeen(it.id)&&boxOf(it.id)>=2&&!exclude.includes(it.id));
  if(cands.length) return pick(cands).id;
  const seen=ALL_ITEMS.filter(it=>isSeen(it.id)&&!exclude.includes(it.id)).sort((a,b)=>boxOf(b.id)-boxOf(a.id));
  return seen.length?seen[0].id:null;
}
/* record how a fact went and when it comes back */
function applyResult(id,res){
  const t=today(); let st=S.items[id];
  if(!st) st=S.items[id]={box:0,due:t,seen:0,ok:0,fail:0,last:null,first:t,prom:null};
  const gap=st.last?daysBetween(st.last,t):null;
  st.seen++;
  if(res.kind==='dash'){
    if(res.clean){ st.ok++; if(st.prom!==t&&st.due<=t){st.box=Math.min(5,st.box+1);st.due=addDays(t,BOX_DAYS[st.box]);st.prom=t;} }
    else { st.fail++; const tm=addDays(t,1); if(st.due>tm) st.due=tm; }
  }else if(res.clean){
    st.ok++;
    if(res.fast&&st.seen===1){ st.box=2; st.prom=t; st.due=addDays(t,BOX_DAYS[2]); }
    else { if(st.prom!==t){st.box=Math.min(5,st.box+1);st.prom=t;} st.due=addDays(t,BOX_DAYS[st.box]); }
  }else{
    st.fail++; st.box=st.box>=3?2:Math.max(0,st.box-1); st.due=addDays(t,1); st.prom=t;
  }
  st.last=t;
  return gap;
}

/* ---- session plan ---- */
function buildPlan(max,newCount){
  const dueIds=dueItems();
  const news=pickNew(newCount);
  const used=new Set(news);
  const warm=easiestKnown([...news]);
  const out=[]; if(warm){out.push({id:warm,role:'warm'});used.add(warm);}
  const revCap=Math.max(0,Math.min(4,max-2-news.length));
  const R=dueIds.filter(id=>!used.has(id)&&!news.includes(id)).slice(0,revCap);
  R.forEach(id=>used.add(id));
  const N=news.map(id=>({id,role:'new'}));
  const Rq=R.map(id=>({id,role:'review'}));
  while(Rq.length||N.length){ if(Rq.length) out.push(Rq.shift()); if(N.length) out.push(N.shift()); }
  /* repeat each new fact once, a few questions later, if there is room */
  const room=()=>out.length<max-1;
  for(const n of news){ if(!room()) break; const at=out.findIndex(e=>e.id===n); const pos=Math.min(out.length,at+3); out.splice(pos,0,{id:n,role:'repeat'}); }
  /* top up with practice if the day is light */
  if(out.length<6){
    const extra=ALL_ITEMS.filter(it=>isSeen(it.id)&&!out.some(e=>e.id===it.id)).sort((a,b)=>boxOf(a.id)-boxOf(b.id)).slice(0,6-out.length);
    extra.forEach(it=>out.push({id:it.id,role:'review'}));
  }
  if(out.length>max-1) out.length=max-1;
  const fin=easiestKnown(out.map(e=>e.id)) || (out.length?out[0].id:null);
  if(fin&&out.length) out.push({id:fin,role:'finish'});
  return out;
}

/* ---- streak, growth ---- */
function bumpStreak(){
  const t=today(), st=S.streak; if(st.last===t) return;
  if(!st.last) st.cur=1; else st.cur=daysBetween(st.last,t)<=3?st.cur+1:1;
  st.last=t; st.best=Math.max(st.best,st.cur);
  if(!S.days.includes(t)) S.days.push(t);
}
function dragonStage(d){ d=d||S.dragon; const n=Math.max(0,S.days.length-((d&&d.since)||0)); return n>=26?3:n>=11?2:n>=4?1:0; }
const STAGE_NAMES=['Hatchling','Young dragon','Island guardian','Elder dragon'];
function snapshot(){
  const secure=ALL_ITEMS.filter(it=>isSecure(it.id)).length, seen=ALL_ITEMS.filter(it=>isSeen(it.id)).length;
  const t=today(); S.snaps=S.snaps.filter(x=>x.date!==t); S.snaps.push({date:t,secure,seen}); if(S.snaps.length>120) S.snaps.shift();
}

/* ================= teaching tools: counters + ten-frames, number line ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fly(fromRect,toRect,gold){
  if(reduceMotion()||!fromRect||!toRect||!fromRect.width) return Promise.resolve();
  return new Promise(res=>{
    const el=document.createElement('div'); el.className='fly'+(gold?' gold':'');
    const w=fromRect.width*0.84;
    el.style.cssText=`left:${fromRect.left+fromRect.width*0.08}px;top:${fromRect.top+fromRect.height*0.08}px;width:${w}px;height:${w}px`;
    document.body.appendChild(el);
    const dx=toRect.left-fromRect.left, dy=toRect.top-fromRect.top;
    const a=el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-30}px) scale(1.15)`},{transform:`translate(${dx}px,${dy}px) scale(1)`}],{duration:380,easing:'ease-in-out'});
    a.onfinish=()=>{el.remove();res();}; a.oncancel=()=>{el.remove();res();};
  });
}

class CounterTool{
  constructor(root,q,cb){this.root=root;this.q=q;this.cb=cb||{};this.alive=true;this.root.addEventListener('click',e=>this.onClick(e));this.init();}
  init(){
    const q=this.q;
    this.mode=q.kind==='bond'?'bond':q.kind==='add'?(q.teen?'teen':'add'):'sub';
    this.A=Array(10).fill(0); this.B=Array(10).fill(0);
    this.merged=false; this.merging=false; this.busy=false; this.touched=false; this.order=[]; this.removed=0; this.hl='';
    if(this.mode==='bond'){ for(let i=0;i<q.a;i++) this.A[i]=1; }
    else if(this.mode==='teen'){ this.A.fill(1); for(let i=0;i<q.teen.o;i++) this.B[i]=1; }
    else if(this.mode==='add'){ for(let i=0;i<q.big;i++) this.A[i]=1; for(let i=0;i<q.small;i++) this.B[i]=1; }
    else { const n=q.sub.n; if(n>10){ this.A.fill(1); for(let i=0;i<n-10;i++) this.B[i]=1; } else { for(let i=0;i<n;i++) this.A[i]=1; } this.target=q.sub.m; this.r0=Math.max(0,n-10); }
    this.draw(); this.updateNote();
  }
  reset(){ this.init(); }
  slotEl(f,i){return this.root.querySelector(`.slot[data-f="${f}"][data-i="${i}"]`);}
  counterHTML(state,f){
    if(state===0) return '';
    const cls=['ct']; if(state===2) cls.push('added'); if(state===3) cls.push('off');
    if((this.mode==='bond'&&state===1)||(this.mode==='add'&&f==='A'&&state===1)||(this.mode==='teen'&&state===1)) cls.push('fixed');
    return `<div class="${cls.join(' ')}"></div>`;
  }
  frameHTML(f,arr,cap,extra=''){
    const full=arr.every(v=>v===1||v===2);
    let h=`<div class="tf-col"><div class="tf-cap">${cap}</div><div class="tf-frame${this.hl===f?' glow':''}${full&&f==='A'?' full':''}${extra}" data-f="${f}">`;
    for(let i=0;i<10;i++){
      const st=arr[i]; let tap='';
      if(this.mode==='bond'&&f==='A') tap=' tap';
      if(this.mode==='add'&&f==='B'&&st===1) tap=' tap';
      if(this.mode==='teen'&&f==='B'&&st!==1) tap=' tap';
      if(this.mode==='sub'&&(st===1||st===3)) tap=' tap';
      h+=`<div class="slot${tap}" data-f="${f}" data-i="${i}" role="button" aria-label="${f==='A'?'First':'Second'} frame, place ${i+1}">${this.counterHTML(st,f)}</div>`;
    }
    return h+'</div></div>';
  }
  draw(){
    const q=this.q; let h='<div class="tf-pair">';
    if(this.mode==='bond'){
      h+=this.frameHTML('A',this.A,`Feeding tray: <b>${q.a}</b> so far`);
    }else if(this.mode==='teen'){
      h+=this.frameHTML('A',this.A,'A full ten');
      h+=this.frameHTML('B',this.B,`<b>${q.teen.o}</b> ones. Add <b>${q.teen.u}</b> more`);
    }else if(this.mode==='add'){
      h+=(this.merged?`<div class="tf-col"><div class="tf-cap">One ten</div><div class="ten-token">10</div></div>`:this.frameHTML('A',this.A,`Start with the bigger number: <b>${q.big}</b>`));
      h+=this.frameHTML('B',this.B,this.merged?'Left over':`Move these across: <b>${q.small}</b>`);
    }else if(q.sub.n<=10){
      h+=this.frameHTML('A',this.A,`<b>${q.sub.n}</b> counters`);
    }else{
      h+=this.frameHTML('A',this.A,'A full ten');
      h+=this.frameHTML('B',this.B,`<b>${q.sub.n-10}</b> ${q.noBridge?'ones':'extra'}`);
    }
    h+='</div><div class="tool-note" data-note></div>';
    this.root.innerHTML=h; this.updateNote();
  }
  count(arr){return arr.filter(v=>v===1||v===2).length;}
  updateNote(){
    const el=this.root.querySelector('[data-note]'); if(!el) return;
    if(this.custom){el.innerHTML=this.custom;return;}
    let t='';
    if(this.mode==='bond'){ const added=this.A.filter(v=>v===2).length; t=this.count(this.A)===10?`Ten! You added <b>${added}</b>.`:`You have added <b>${added}</b>. Tap an empty circle to add a counter.`; }
    else if(this.mode==='teen'){ const added=this.B.filter(v=>v===2).length; t=added>=this.q.teen.u?`You added <b>${added}</b> to the ones.`:`You have added <b>${added}</b> of <b>${this.q.teen.u}</b>. Tap an empty circle in the second frame.`; }
    else if(this.mode==='add'){ t=this.q.noBridge&&!this.merged?(this.count(this.B)===0?'Now count all the counters.':'Tap counters in the second frame to move them across.'):this.merged?`<b>10</b> and <b>${this.count(this.B)}</b> more.`:`Tap counters in the second frame to move them across.`; }
    else { const left=this.count(this.A)+this.count(this.B); t=this.removed>=this.target?`You took away <b>${this.removed}</b>. Counters left: <b>${left}</b>.`:`Taken away: <b>${this.removed}</b> of <b>${this.target}</b>. Tap counters to take them away.`; }
    el.innerHTML=t;
  }
  note(html){this.custom=html;this.updateNote();}
  setHighlight(f){this.hl=f||'';const fr=this.root.querySelector(`.tf-frame[data-f="${f}"]`); this.root.querySelectorAll('.tf-frame').forEach(x=>x.classList.remove('glow')); if(fr) fr.classList.add('glow');}
  onClick(e){
    if(!this.alive||this.busy||this.merging) return;
    const slot=e.target.closest('.slot'); if(!slot||!this.root.contains(slot)) return;
    const f=slot.dataset.f, i=+slot.dataset.i;
    this.custom=null;
    if(this.mode==='bond'&&f==='A'){
      if(this.A[i]===2){ this.A[i]=0; this.touch(); this.draw(); Audio_.fx('tap'); }
      else if(this.A[i]===0){ const j=this.A.indexOf(0); this.A[j]=2; this.touch(); this.draw(); Audio_.fx('pop'); const c=this.slotEl('A',j).querySelector('.ct'); if(c&&!reduceMotion()) c.animate([{transform:'scale(.2)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260}); if(this.count(this.A)===10){Audio_.fx('ten');} }
    }else if(this.mode==='teen'&&f==='B'){
      if(this.B[i]===2){ this.B[i]=0; this.touch(); this.draw(); Audio_.fx('tap'); }
      else if(this.B[i]===0){ const j=this.B.indexOf(0); this.B[j]=2; this.touch(); this.draw(); Audio_.fx('pop'); const c=this.slotEl('B',j).querySelector('.ct'); if(c&&!reduceMotion()) c.animate([{transform:'scale(.2)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260}); }
    }else if(this.mode==='add'&&f==='B'&&this.B[i]===1){ this.touch(); this.moveToA(i); }
    else if(this.mode==='sub'){
      if(this.A[i]===1&&f==='A'||this.B[i]===1&&f==='B'){
        if(this.removed>=this.target){ this.note(`You have taken away enough. Counters left: <b>${this.count(this.A)+this.count(this.B)}</b>.`); return; }
        (f==='A'?this.A:this.B)[i]=3; this.removed++; this.order.push(f); this.touch(); Audio_.fx('tap'); this.draw();
      }else if((f==='A'?this.A:this.B)[i]===3){
        (f==='A'?this.A:this.B)[i]=1; this.removed--; const k=this.order.lastIndexOf(f); if(k>=0) this.order.splice(k,1); this.touch(); this.draw();
      }
    }
  }
  touch(){this.touched=true; if(this.cb.onTouch) this.cb.onTouch();}
  async moveToA(bi){
    const j=this.A.indexOf(0); if(j<0){ this.note('That frame is full. That makes a ten!'); return; }
    const fromEl=this.slotEl('B',bi).querySelector('.ct'); const fr=fromEl?fromEl.getBoundingClientRect():null;
    this.B[bi]=0; this.A[j]=2; this.busy=true; this.draw();
    const toEl=this.slotEl('A',j).querySelector('.ct'); if(toEl) toEl.classList.add('hide');
    Audio_.fx('pop');
    await fly(fr,toEl?toEl.getBoundingClientRect():null,true);
    if(toEl) toEl.classList.remove('hide'); this.busy=false;
    if(this.A.indexOf(0)<0) await this.doMerge();
  }
  async doMerge(){
    this.merging=true; Audio_.fx('ten');
    const fr=this.root.querySelector('.tf-frame[data-f="A"]'); if(!fr){this.merging=false;return;}
    fr.classList.add('full'); await sleep(reduceMotion()?10:550);
    const r=fr.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    fr.querySelectorAll('.ct').forEach(c=>{const b=c.getBoundingClientRect(); c.style.setProperty('--mx',(cx-(b.left+b.width/2))+'px'); c.style.setProperty('--my',(cy-(b.top+b.height/2))+'px'); c.classList.add('merge');});
    await sleep(reduceMotion()?10:520);
    this.merged=true; this.merging=false; this.draw();
  }
  strategyUsed(){
    if(this.mode==='bond') return this.count(this.A)===10&&this.A.some(v=>v===2);
    if(this.mode==='teen') return this.B.filter(v=>v===2).length===this.q.teen.u;
    if(this.mode==='add') return this.q.noBridge?this.count(this.B)===0:(this.merged||this.count(this.A)===10);
    if(this.q.noBridge) return this.removed>=this.target&&(this.q.sub.n<=10||this.order.every(x=>x==='B'));
    return this.r0>0&&this.order.length>=this.r0&&this.order.slice(0,this.r0).every(x=>x==='B');
  }
  /* animated worked example */
  async demo(){
    this.reset(); this.alive=true; this.busy=true; await sleep(450);
    const q=this.q;
    if(this.mode==='bond'){
      for(let k=0;k<10-q.a;k++){ const j=this.A.indexOf(0); this.A[j]=2; this.draw(); Audio_.fx('pop'); await sleep(650); }
      this.note(`${q.a} and <b>${10-q.a}</b> more make ten.`);
    }else if(this.mode==='teen'){
      for(let k=0;k<q.teen.u;k++){ const j=this.B.indexOf(0); this.B[j]=2; this.draw(); Audio_.fx('pop'); await sleep(600); }
      this.note(`<b>${q.teen.o}</b> and <b>${q.teen.u}</b> make <b>${q.teen.o+q.teen.u}</b>, with the ten that is <b>${q.land}</b>.`);
    }else if(this.mode==='add'&&q.noBridge){
      this.busy=false; for(let k=0;k<q.small;k++){ const bi=this.B.findIndex(v=>v===1); if(bi<0) break; await this.moveToA(bi); await sleep(250); }
      await sleep(600); this.note(`<b>${q.big}</b> and <b>${q.small}</b> together make <b>${q.land}</b>.`);
    }else if(this.mode==='add'){
      const need=10-q.big; this.busy=false;
      for(let k=0;k<need;k++){ const bi=this.B.findIndex(v=>v===1); await this.moveToA(bi); await sleep(250); }
      await sleep(900);
      this.note(`<b>${q.big}</b> needed <b>${need}</b> to make ten. <b>${q.small-need}</b> are left, so <b>10 + ${q.small-need}</b>.`);
    }else if(q.noBridge){
      const n=q.sub.n,m=q.sub.m;
      for(let k=0;k<m;k++){ if(n>10){ const bi=this.B.findIndex(v=>v===1); this.B[bi]=3; this.order.push('B'); } else { const ai=this.A.lastIndexOf(1); this.A[ai]=3; this.order.push('A'); } this.removed++; this.draw(); Audio_.fx('tap'); await sleep(600); }
      this.note(`<b>${n} − ${m}</b> leaves <b>${n-m}</b>.`);
    }else{
      const n=q.sub.n,m=q.sub.m,r0=n-10;
      for(let k=0;k<r0;k++){ const bi=this.B.findIndex(v=>v===1); this.B[bi]=3; this.removed++; this.order.push('B'); this.draw(); Audio_.fx('tap'); await sleep(600); }
      this.note(`Back to <b>10</b>. We still need to take away <b>${m-r0}</b>.`); await sleep(1200); this.custom=null;
      for(let k=0;k<m-r0;k++){ const ai=this.A.lastIndexOf(1); this.A[ai]=3; this.removed++; this.order.push('A'); this.draw(); Audio_.fx('tap'); await sleep(600); }
      this.note(`<b>10 − ${m-r0}</b> leaves <b>${n-m}</b>.`);
    }
    this.busy=false;
  }
}

class LineTool{
  constructor(root,q,cb){this.root=root;this.q=q;this.cb=cb||{};this.root.addEventListener('click',e=>this.onClick(e));this.init();}
  init(){
    const q=this.q;
    this.start=q.kind==='bond'?q.a:q.kind==='add'?q.big:q.sub.n;
    this.pos=this.start; this.hops=[]; this.touched=false; this.custom=null; this.busy=false;
    this.draw(false);
  }
  reset(){this.init();}
  X(n){return 30+n*39;}
  draw(animate){
    const Y=150,X=n=>this.X(n);
    let s=`<div class="line-wrap"><svg viewBox="0 0 840 230" role="img" aria-label="Number line from 0 to 20">`;
    s+=`<line x1="${X(0)}" y1="${Y}" x2="${X(20)}" y2="${Y}" stroke="var(--ink2)" stroke-width="4" stroke-linecap="round"/>`;
    for(let n=0;n<=20;n++){const ten=n===10; s+=`<line class="${ten?'nl-ten':'nl-tick'}" x1="${X(n)}" x2="${X(n)}" y1="${Y-(ten?24:12)}" y2="${Y+(ten?24:12)}"/><text class="nl-lab${ten?' ten':''}" x="${X(n)}" y="${Y+(ten?56:42)}">${n}</text>`;}
    for(let n=0;n<=20;n++) s+=`<rect class="nl-hit" data-n="${n}" x="${X(n)-19.5}" y="40" width="39" height="170"/>`;
    this.hops.forEach((h,k)=>{
      const x1=X(h.from),x2=X(h.to),d=Math.abs(x2-x1),ctl=Y-8-30-d*.45,apex=(Y-8+ctl)/2;
      s+=`<path class="nl-arc" pathLength="1" d="M${x1} ${Y-8} Q${(x1+x2)/2} ${ctl} ${x2} ${Y-8}" style="${animate&&k===this.hops.length-1?'':'animation:none;stroke-dashoffset:0'}"/>`;
      s+=`<text class="nl-hoplab" x="${(x1+x2)/2}" y="${apex-8}">${h.to>h.from?'+':'−'}${Math.abs(h.to-h.from)}</text>`;
    });
    const b=S.dragon?S.dragon.body:'#2a9d8f';
    s+=`<g style="transform:translate(${X(this.pos)}px,0);transition:transform ${reduceMotion()?0:.45}s ease"><path d="M-8 ${Y-26} h16 l-8 11z" fill="${b}"/><circle cx="0" cy="${Y-42}" r="18" fill="${b}"/><circle cx="-6" cy="${Y-45}" r="4.6" fill="#fff"/><circle cx="6" cy="${Y-45}" r="4.6" fill="#fff"/><circle cx="-5" cy="${Y-44}" r="2.2" fill="#14202a"/><circle cx="7" cy="${Y-44}" r="2.2" fill="#14202a"/><path d="M-7 ${Y-36} q7 6 14 0" stroke="#14202a" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`;
    s+=`</svg></div><div class="tool-note" data-note></div>`;
    this.root.innerHTML=s; this.updateNote();
  }
  updateNote(){
    const el=this.root.querySelector('[data-note]'); if(!el) return;
    if(this.custom){el.innerHTML=this.custom;return;}
    if(!this.hops.length){ el.innerHTML=this.q.kind==='add'?`Start on the bigger number, <b>${this.start}</b>. Tap a number to hop there.`:`You start on <b>${this.start}</b>. Tap a number to hop there.`; }
    else el.innerHTML=`You are on <b>${this.pos}</b>. Tap another number to keep hopping.`;
  }
  note(html){this.custom=html;this.updateNote();}
  setHighlight(){ const t=this.root.querySelector('.nl-lab.ten'); if(t) t.style.fill='var(--ember)'; }
  onClick(e){
    const hit=e.target.closest('.nl-hit'); if(!hit||this.busy) return;
    this.custom=null; this.hopTo(+hit.dataset.n);
  }
  hopTo(n,silent){
    if(n===this.pos) return;
    this.hops.push({from:this.pos,to:n}); this.pos=n; if(!silent){this.touched=true; if(this.cb.onTouch) this.cb.onTouch();}
    Audio_.fx('pop'); this.draw(true);
  }
  strategyUsed(){ if(this.q.noBridge) return this.hops.length>0&&this.pos===this.q.land; return this.hops.length>0&&this.hops.some(h=>h.to===10); }
  async demo(){
    this.reset(); this.busy=true; await sleep(500); const q=this.q;
    const path=q.noBridge?[q.land]:q.kind==='bond'?[10]:q.kind==='add'?[10,q.big+q.small]:[10,q.sub.n-q.sub.m];
    for(const n of path){ this.hopTo(n,true); await sleep(1300); }
    this.busy=false;
    const m=q.noBridge?(q.kind==='add'?`Start on <b>${q.big}</b>, hop on <b>${q.small}</b>. You land on <b>${q.land}</b>.`:`Start on <b>${q.sub.n}</b>, hop back <b>${q.sub.m}</b>. You land on <b>${q.land}</b>.`):q.kind==='bond'?`${q.a} hops to <b>10</b>: that is <b>${10-q.a}</b> more.`:q.kind==='add'?`Hop to <b>10</b> first, then hop the rest. You land on <b>${q.big+q.small}</b>.`:`Hop back to <b>10</b> first, then hop back the rest. You land on <b>${q.sub.n-q.sub.m}</b>.`;
    this.note(m);
  }
}

/* ================= training session + Dragon Dash ================= */
const THINGS=[{many:'fish'},{many:'berries'},{many:'gems'},{many:'eggs'},{many:'shells'}];
let SESS=null, Q=null, DASH=null;

function makeQ(it,opts={}){
  const D=S.dragon.name, th=pick(THINGS), q={it,kind:it.kind,ans:it.ans,th,id:it.id};
  if(it.kind==='wadd'||it.kind==='tadd'){
    const teen=it.kind==='tadd', big=teen?it.T:it.x, small=teen?it.u:it.y, sum=big+small;
    const flip=Math.random()<.5, first=flip?small:big, second=flip?big:small;
    q.kind='add'; q.noBridge=true; q.big=big; q.small=small; q.land=sum; if(teen) q.teen={o:it.o,u:it.u};
    q.eq=[{t:first},{op:'+'},{t:second},{op:'='},{ans:1}];
    q.story=`${esc(D)} found <b>${first}</b> ${th.many}, then <b>${second}</b> more. How many ${th.many} altogether?`;
    if(teen){
      q.nudge={counters:`The first frame is a full ten. Add the ${small} to the ones in the second frame. Tap empty circles.`,line:`Start on ${big}. Hop on ${small}.`};
      q.explain=`<b>${big}</b> is a ten and <b>${it.o}</b>. <b>${it.o} + ${small} = ${it.o+small}</b>, so <b>10 + ${it.o+small} = ${sum}</b>.`;
    }else{
      q.nudge={counters:`Move the counters from the second frame across to the first. Then count them all.`,line:`Start on the bigger number, ${big}. Hop on ${small}.`};
      q.explain=`<b>${big}</b> and <b>${small}</b> together make <b>${sum}</b>.`;
    }
  }else if(it.kind==='wsub'||it.kind==='tsub'){
    const teen=it.kind==='tsub', askX=!teen&&it.x!==it.y&&Math.random()<.5, m=teen?it.u:(askX?it.x:it.y);
    q.kind='sub'; q.noBridge=true; q.sub={n:it.c,m}; q.ans=teen?it.T:(askX?it.y:it.x); q.land=it.c-m;
    q.hintLine=`You know <b>${teen?it.T:it.x} + ${it.y===undefined?it.u:it.y} = ${it.c}</b>.`;
    q.eq=[{t:it.c},{op:'−'},{t:m},{op:'='},{ans:1}];
    q.story=`${esc(D)} has <b>${it.c}</b> ${th.many}. <b>${m}</b> of them roll away. How many are left?`;
    q.nudge=teen?{counters:`Take the ${m} away from the ones in the second frame.`,line:`Start on ${it.c}. Hop back ${m}.`}
                :{counters:`You have ${it.c} counters. Tap ${m} of them to take them away.`,line:`Start on ${it.c}. Hop back ${m}.`};
    q.explain=teen?`<b>${it.c} − ${m} = ${q.ans}</b>. Take ${m} from the ${it.c-10} ones and the ten stays.`:`${q.hintLine} So <b>${it.c} − ${m} = ${q.ans}</b>.`;
  }else if(it.kind==='bond'){
    q.a=it.a; q.eq=[{t:it.a},{op:'+'},{ans:1},{op:'='},{t:10}];
    q.story=`${esc(D)}'s feeding tray has <b>${it.a}</b> ${th.many}. How many more fill it up to ten?`;
    q.nudge={counters:'Fill the tray up to ten. Tap an empty circle to add a counter.',line:'Hop to 10. How far is it from your starting number?'};
    q.explain=`${it.a} and <b>${10-it.a}</b> make <b>10</b>.`;
  }else if(it.kind==='add'){
    const flip=Math.random()<.5, first=flip?it.y:it.x, second=flip?it.x:it.y;
    q.big=it.x; q.small=it.y; q.eq=[{t:first},{op:'+'},{t:second},{op:'='},{ans:1}];
    q.story=`${esc(D)} found <b>${first}</b> ${th.many}, then <b>${second}</b> more. How many ${th.many} altogether?`;
    const need=10-it.x;
    q.nudge={counters:'Fill the first frame up to ten. Tap counters in the second frame to move them across.',line:'Start on the bigger number. Hop to 10 first, then hop the rest.'};
    q.explain=`<b>${it.x}</b> needs <b>${need}</b> to make ten. <b>${it.y}</b> gives <b>${need}</b> and has <b>${it.y-need}</b> left. <b>10 + ${it.y-need} = ${it.ans}</b>.`;
  }else if(it.kind==='sub'){
    q.sub={n:it.n,m:it.m}; q.eq=[{t:it.n},{op:'−'},{t:it.m},{op:'='},{ans:1}];
    const verb=pick(['ate','gave away','lost']);
    q.story=`${esc(D)} had <b>${it.n}</b> ${th.many} and ${verb} <b>${it.m}</b>. How many are left?`;
    const r0=it.n-10;
    q.nudge={counters:'First take away enough to get back to ten. Tap the counters in the small frame.',line:'Hop back to 10 first, then hop back the rest.'};
    q.explain=`Take away <b>${r0}</b> to get back to <b>10</b>. Then take away <b>${it.m-r0}</b> more. <b>10 − ${it.m-r0} = ${it.ans}</b>.`;
  }else{
    const askX=it.x!==it.y&&Math.random()<.5, m=askX?it.x:it.y;
    q.sub={n:it.c,m}; q.ans=askX?it.y:it.x; q.hintLine=`You know <b>${it.x} + ${it.y} = ${it.c}</b>.`;
    q.eq=[{t:it.c},{op:'−'},{t:m},{op:'='},{ans:1}];
    q.story=`${esc(D)} has <b>${it.c}</b> ${th.many}. <b>${m}</b> of them are shiny. How many are not shiny?`;
    const r0=it.c-10;
    q.nudge={counters:'Use what you know: '+`${it.x} + ${it.y} = ${it.c}. Or take away to get back to ten first.`,line:'Hop back to 10 first, then hop back the rest.'};
    q.explain=`${q.hintLine} So <b>${it.c} − ${m} = ${q.ans}</b>. Or: take away <b>${r0}</b> to reach 10, then <b>${m-r0}</b> more.`;
  }
  return q;
}
function eqHTML(q,answer,has){
  return q.eq.map(t=>t.op?`<span class="op">${t.op}</span>`:t.ans?`<span class="slot-ans${answer?' has':''}" aria-label="your answer">${answer||''}</span>`:`<span>${t.t}</span>`).join('');
}
function fbHTML(kind,html,icon){return `<div class="fb ${kind}" role="status" aria-live="polite">${icon?ic(icon,26):''}<div>${html}</div></div>`;}

  if(SESS.idx>=SESS.plan.length||(Date.now()>SESS.capAt&&SESS.idx>=6)) return finishSession();

  const it=ITEM[entry.id]; const q=makeQ(it);
  const st=S.items[entry.id];
  const sugg=(st&&st.seen>=2&&st.seen%2===0)?'line':'counters';
  Q={entry,q,t0:Date.now(),lastAct:Date.now(),attempts:0,hints:0,guided:entry.role==='new',rapid:0,done:false,answer:'',hard:null,tool:'counters',sugg,
     touched:false,counters:null,line:null,toolsUsed:new Set(),demo:false,locked:false,gap:null};
  if(SESS.qShownAt==null) SESS.qShownAt=Date.now();

function highlightTool(){ const q=Q.q; if(q.kind==='bond') Q.counters.setHighlight('A'); else if(q.kind==='add') Q.counters.setHighlight(q.teen?'B':'A'); else Q.counters.setHighlight(q.sub.n<=10?'A':'B'); }
function setFb(kind,html,icon){ const el=$('#fb'); if(el) el.innerHTML=fbHTML(kind,html,icon); }
function renderRight(){
  const el=$('#rightbottom'); if(!el) return;
  if(Q.done){
    el.innerHTML=`<button class="btn btn-primary btn-big" data-act="next" style="width:100%">${SESS.idx>=SESS.plan.length?'Finish training':'Next'} ${ic('next',24)}</button>`;

  el.innerHTML=`<div class="pad">${pad}</div><div style="margin-top:8px"><button class="btn btn-soft" style="width:100%" data-act="help" id="helpbtn">${ic('help',22)} ${Q.hints>=1?'Show me how':'Not sure yet'}</button></div>`;

function setAnswer(a){ Q.answer=a; const e=$('#eq'); if(e) e.innerHTML=eqHTML(Q.q,a); }
function switchTool(t,silent){
  Q.tool=t; Q.toolsUsed.add(t);

  $('#tab-counters').setAttribute('aria-selected',t==='counters'); $('#tab-line').setAttribute('aria-selected',t==='line');

}
function activeTool(){return Q.tool==='line'?Q.line:Q.counters;}

function pressHelp(auto){
  if(Q.done||Q.locked) return;
  Q.hints++; Q.lastAct=Date.now();
  if(!Q.hard&&!auto){Q.hard='asked';SESS.hardAsked++;}
  if(Q.hints===1){
    const t=activeTool(); t.reset(); t.note(esc(Q.q.nudge[Q.tool]));
    if(Q.tool==='counters') highlightTool(); else Q.line.setHighlight();
    setFb('info',`Good thinking. Let's look together. ${esc(Q.q.nudge[Q.tool])}`,'help');
    $('#helpbtn').innerHTML=`${ic('help',22)} Show me how`;
  }else{
    runDemo();
  }
}
async function runDemo(){
  Q.locked=true; Q.demo=true; setFb('info','Watch how it works.','help');
  const t=activeTool(); await t.demo();
  Q.locked=false; setFb('info',`${Q.q.explain}<br>Now you type the answer.`,'help');
}
function submitAnswer(){
  if(!Q||Q.done||Q.locked||screen!=='question') return;
  if(Q.answer==='') return;
  const val=parseInt(Q.answer,10), now=Date.now();
  if(SESS.firstAnswerMs==null) SESS.firstAnswerMs=now-SESS.qShownAt;
  if(val===Q.q.ans) return answerRight();
  /* wrong */
  const quick=(now-Q.lastAct)<2500&&!Q.touched&&Q.attempts===0&&Q.hints===0&&Q.rapid===0;
  if(quick){
    Q.rapid++; if(!Q.hard){Q.hard='guess';SESS.hardGuess++;}
    Audio_.fx('soft'); setAnswer(''); Q.lastAct=now;
    setFb('soft','That was speedy! Check it with the counters or the number line first.','help'); return;
  }
  Q.attempts++; if(!Q.hard){Q.hard=Q.hints>0?'asked':'tried'; if(Q.hard==='tried') SESS.hardTry++;}
  Audio_.fx('soft'); setAnswer(''); Q.lastAct=now;
  if(Q.attempts===1&&Q.hints===0) setFb('soft','Not yet. Check it with the counters, then try again.','help');
  else { setFb('soft','Not yet. Let us look at it together.','help'); if(Q.hints<2) pressHelp(true); }
}
function answerRight(){
  Q.done=true; const q=Q.q, entry=Q.entry;
  const clean=Q.attempts===0&&Q.hints===0, strat=Q.counters.strategyUsed()||Q.line.strategyUsed();
  const toolUsed=Q.counters.touched?'counters':Q.line.touched?'line':'none';
  const fast=clean&&!S.items[entry.id]&&!!(SKILLS.find(k=>k.id===q.it.skill)||{}).easy;
  const gap=applyResult(entry.id,{clean,kind:'train',fast});
  const ms=Date.now()-Q.t0;
  let gain=clean?3:1; if(clean&&strat) gain+=1;
  if(SESS.bonus){ gain=Math.min(clean?2:1,extraLeft()); S.day.extra=(S.day.extra||0)+gain; }
  if(gain){S.embers+=gain; SESS.earned+=gain;}
  SESS.ok++; SESS.total++; if(clean) SESS.clean++; else SESS.help++; if(strat&&clean) SESS.strat++;
  SESS.pips[SESS.idx-1]=clean?'done':'help';
  if(!clean){ SESS.struggleRun++; } else SESS.struggleRun=0;
  S.log.push({t:Date.now(),id:entry.id,ok:true,clean,hints:Q.hints,att:Q.attempts,rapid:Q.rapid,ms,tool:toolUsed,strat:!!strat,hard:Q.hard,gap,role:entry.role,kind:'train'});
  /* come back to it later in the same session if it needed help */
  if(!clean&&entry.role!=='repeat'&&entry.role!=='rebuild'&&!entry.again){ SESS.plan.splice(Math.min(SESS.plan.length,SESS.idx+3),0,{id:entry.id,role:'repeat',again:true}); }
  /* feedback */
  let msg;
  if(clean&&strat&&q.noBridge) msg=q.kind==='add'?'You worked it out step by step. Nice!':'You took them away and counted what was left. Nice!';
  else if(clean&&strat) msg=q.kind==='sub'||q.kind==='fam'?'You stepped back to ten first. Smart strategy!':q.kind==='bond'?'You filled the tray to ten. Nice work!':'You made ten first, then added the rest. That is the trick!';
  else if(clean&&toolUsed!=='none') msg=`You checked it with the ${toolUsed==='line'?'number line':'counters'}. That is a good habit.`;

const RR=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function wordProb(kind,who){const r=wordProb0(kind,who);r.text=r.text.replace(/\b1 berries\b/g,'1 berry').replace(/\b1 gems\b/g,'1 gem').replace(/\b1 shells\b/g,'1 shell').replace(/\b1 eggs\b/g,'1 egg').replace(/\b1 apples\b/g,'1 apple');return r}
function wordProb0(kind,who){
  const D=(S.dragon&&S.dragon.name)||'Your dragon', th=pick(WORDTHINGS); who=who||D;
  switch(kind){
    case 'add10':{const a=RR(1,8),b=RR(1,10-a);return {text:`${who} has ${a} ${th} and finds ${b} more. How many ${th} now?`,ans:a+b}}
    case 'bonds':{const a=RR(1,9);return {text:`The tray holds 10 ${th}. It has ${a}. How many more fill it up?`,ans:10-a}}
    case 'missing':{const n=RR(8,20),h=RR(2,n-2);return {text:`${who} needs ${n} ${th}. There are ${h}. How many more are needed?`,ans:n-h}}
    case 'add20':{const a=RR(6,9),b=RR(11-a,Math.min(9,20-a));return {text:`${who} has ${a} ${th} and gets ${b} more. How many altogether?`,ans:a+b}}
    case 'sub20':{const n=RR(11,20),m=RR(3,Math.min(9,n-1));return {text:`${who} has ${n} ${th} and eats ${m}. How many are left?`,ans:n-m}}
    case 'double':{const a=RR(2,10);return {text:`${who} puts ${a} ${th} in one basket and ${a} in another. How many in all?`,ans:2*a}}
    case 'half':{const n=2*RR(1,10);return {text:`${n} ${th} are shared equally between 2 dragons. How many does each get?`,ans:n/2}}
    case 'twostep':{const a=RR(5,12),b=RR(2,8),c=RR(1,Math.min(6,a+b-1));return {text:`${who} has ${a} ${th}, finds ${b} more, then eats ${c}. How many are left?`,ans:a+b-c}}
    case 'group':{const g=pick([2,5]),k=g===2?RR(2,6):RR(2,4);return {text:`There are ${k} nests. Each nest has ${g} eggs. How many eggs in all?`,ans:g*k}}
  }
  return {text:'1 + 1 = ?',ans:2};
}
