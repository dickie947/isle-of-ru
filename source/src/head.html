<title>Isle of Ru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout concept: one calm full-height stage. Home is an island scene with a few big buttons.
   Training is a two-column desk: tools on the left, the question and keypad on the right. */
:root{
  --bg:#c9d2cf; --bg2:#b7c4c1; --surface:#f6ecd5; --surface2:#ecdfc0; --ink:#2a2118; --ink2:#5b4d3b; --line:#b79d6c;
  --wood:#6a4a28; --wood2:#8d6a3d; --iron:#3a4650;
  --tide:#2c6a72; --tide2:#22545b; --tide-ink:#ffffff; --ember:#d9531e; --gold:#e8a935; --moss:#4a7c3f; --plum:#6f4a8e;
  --unit:#d9531e; --ten:#2f62b8; --hund:#3f8a4a;
  --good:#2b7447; --good-bg:#dcebd0; --soft:#9a5a0a; --soft-bg:#f6e1b0; --info-bg:#dde8e3;
  --sky1:#5a7d92; --sky2:#f1c98a; --sea1:#3f6f80; --sea2:#1d3f50; --grass:#6f9a52; --grass2:#4d7a3f; --rock:#7d8a8c; --rock2:#566267; --sand:#cdb98a;
  --sun-op:1; --moon-op:0; --star-op:0; --cloud:#e9e1d0; --mist:#e8e4d8;
  --shadow:0 6px 18px rgba(42,33,24,.22);
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-title:'Cinzel','Trajan Pro',Georgia,serif;
  --font-body:'Lexend',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1519; --bg2:#141d22; --surface:#1c2529; --surface2:#222d32; --ink:#f0e8d6; --ink2:#b9ae98; --line:#5a4730;
    --wood:#8a6a3e; --wood2:#a8854f; --iron:#7d8c97;
    --tide:#5bb3ba; --tide2:#86cdd2; --tide-ink:#06242a; --ember:#ff8248; --gold:#ffcb5c; --moss:#86b872; --plum:#c39be2;
    --good:#8fd6a0; --good-bg:#1a3a28; --soft:#ffc766; --soft-bg:#3d2f10; --info-bg:#17303a;
    --sky1:#0f1a2c; --sky2:#6a4e62; --sea1:#1e4b60; --sea2:#0d2a3a; --grass:#4a7a46; --grass2:#38603a; --rock:#4f5c63; --rock2:#3b464c; --sand:#7d6f4f;
    --sun-op:0; --moon-op:1; --star-op:1; --cloud:#6f6f92; --mist:#8d93ad;
    --shadow:0 6px 22px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1519; --bg2:#141d22; --surface:#1c2529; --surface2:#222d32; --ink:#f0e8d6; --ink2:#b9ae98; --line:#5a4730;
  --wood:#8a6a3e; --wood2:#a8854f; --iron:#7d8c97;
  --tide:#5bb3ba; --tide2:#86cdd2; --tide-ink:#06242a; --ember:#ff8248; --gold:#ffcb5c; --moss:#86b872; --plum:#c39be2;
  --good:#8fd6a0; --good-bg:#1a3a28; --soft:#ffc766; --soft-bg:#3d2f10; --info-bg:#17303a;
  --sky1:#0f1a2c; --sky2:#6a4e62; --sea1:#1e4b60; --sea2:#0d2a3a; --grass:#4a7a46; --grass2:#38603a; --rock:#4f5c63; --rock2:#3b464c; --sand:#7d6f4f;
  --sun-op:0; --moon-op:1; --star-op:1; --cloud:#6f6f92; --mist:#8d93ad;
  --shadow:0 6px 22px rgba(0,0,0,.5);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-title);font-weight:700;letter-spacing:.02em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{display:inline-block;vertical-align:-.2em;flex:none}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding-block:12px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{border-bottom-width:4px!important;box-shadow:0 2px 0 rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.55em 1.3em;border-radius:16px;font-weight:600;
  font-size:1rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);transition:transform .12s ease,background .15s ease,border-color .15s ease;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{border-color:var(--tide)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--tide);color:var(--tide-ink);border-color:var(--tide);font-family:var(--font-display);font-size:1.2rem;letter-spacing:.01em}
.btn-primary:hover{background:var(--tide2);border-color:var(--tide2)}
.btn-ember{background:var(--ember);color:#fff;border-color:var(--ember);font-family:var(--font-display);font-size:1.25rem}
.btn-ember:hover{filter:brightness(1.06);border-color:var(--ember)}
.btn-soft{background:var(--soft-bg);border-color:transparent;color:var(--ink)}
.btn-soft:hover{border-color:var(--gold)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2);border-color:var(--line)}
.btn-big{min-height:68px;font-size:1.45rem;padding:.5em 1.8em;border-radius:22px}
.btn-sm{min-height:42px;padding:.3em .9em;font-size:.9rem;border-radius:12px}
.btn-icon{min-width:52px;padding:.4em}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.3em .8em;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:.95rem}
.pill .ic{color:var(--ember)}
.pill.gold .ic{color:var(--gold)}

/* create dragon */
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;padding:12px 4px}
.create .preview{background:radial-gradient(120% 90% at 50% 20%,var(--sky2),var(--sky1));border-radius:28px;min-height:360px;display:grid;place-items:center;padding:16px;box-shadow:var(--shadow)}
.create .preview svg{width:min(340px,70%);height:auto}
.create .btn{white-space:nowrap}
.opt{margin-bottom:14px}
.opt h3{font-size:1.05rem;margin-bottom:8px;color:var(--ink2);font-family:var(--font-body);font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:.4em 1em;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:500;min-height:44px}
.chip[aria-pressed="true"]{background:var(--tide);color:var(--tide-ink);border-color:var(--tide)}
.field{width:100%;font:inherit;font-size:1.3rem;font-family:var(--font-display);padding:.45em .8em;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:54px}

/* home scene */
.stage{position:relative;flex:1;min-height:520px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:var(--sky1)}
.stage>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.hud-l,.hud-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nameplate{background:var(--surface);border-radius:16px;padding:.35em .9em;border:2px solid var(--line);box-shadow:var(--shadow)}
.nameplate b{font-family:var(--font-display);font-size:1.25rem;display:block;line-height:1.1}
.nameplate span{font-size:.8rem;color:var(--ink2)}
.dock{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 14px}
.bubble{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:.55em 1.1em;border-radius:18px;font-weight:500;box-shadow:var(--shadow);max-width:min(440px,86%);text-align:center;border:2px solid var(--line)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.footlinks{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 0;color:var(--ink2);font-size:.9rem;gap:10px;flex-wrap:wrap}
.hit{cursor:pointer}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.1)}}
.cloud{animation:drift 26s ease-in-out infinite alternate}
.cloud.c2{animation-duration:34s;animation-direction:alternate-reverse}
.waves{animation:wave 9s linear infinite}
.dragon-bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.flame{animation:flick .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.heart{position:absolute;pointer-events:none;color:#ff6b8b;animation:floatup 1.3s ease-out forwards;font-size:30px}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-90px) scale(1.2)}}

/* sheets / modal */
.veil{position:fixed;inset:0;background:rgba(8,20,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fadein .2s ease}
.sheet{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);width:min(780px,100%);max-height:92vh;overflow:auto;padding:22px 24px;border:2px solid var(--line)}
.sheet.wide{width:min(980px,100%)}
.sheet h2{font-size:1.7rem;margin-bottom:6px}
.sheet .sub{color:var(--ink2);margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:.45em 1.1em;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;min-height:46px}
.tab[aria-selected="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.tab .star{color:var(--gold);margin-left:.3em}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.card>svg{width:84px;height:84px}
.card b{font-family:var(--font-display);font-size:1.1rem}
.card small{color:var(--ink2);min-height:2.6em}
.card .own{color:var(--good);font-weight:600}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.pips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pip{width:26px;height:10px;border-radius:99px;background:var(--line);transition:background .3s,transform .3s}
.pip.done{background:var(--moss)}
.pip.help{background:var(--gold)}
.pip.now{background:var(--tide);transform:scaleY(1.4)}
.desk{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:18px;flex:1;min-height:0}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.story{font-size:1.2rem;line-height:1.5}
.story b{font-family:var(--font-display);font-size:1.35em;color:var(--tide);padding:0 .08em}
.eq{display:flex;align-items:center;justify-content:center;gap:.35em;font-family:var(--font-display);font-size:clamp(2.2rem,4.6vw,3.4rem);font-weight:600;flex-wrap:wrap;padding:6px 0}
.eq .op{color:var(--ink2)}
.eq .slot-ans{min-width:2.1em;height:1.45em;border-radius:14px;border:3px dashed var(--tide);display:inline-flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--tide)}
.eq .slot-ans.has{border-style:solid}
.eq-sub{text-align:center;color:var(--ink2);font-size:1.05rem}
.fb{min-height:62px;border-radius:16px;padding:.6em 1em;font-weight:500;display:flex;align-items:center;gap:.6em;background:var(--surface2);color:var(--ink2);line-height:1.35}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.soft{background:var(--soft-bg);color:var(--soft)}
.fb.info{background:var(--info-bg);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .btn{min-height:58px;font-size:1.5rem;font-family:var(--font-display);padding:.2em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tool-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:280px}
.tool-note{text-align:center;color:var(--ink2);min-height:1.5em;font-size:1rem;margin-top:8px}
.tool-note b{color:var(--ink)}
.tf-pair{display:flex;gap:22px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.tf-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.tf-cap{font-weight:600;color:var(--ink2);font-size:.95rem;min-height:1.4em}
.tf-frame{display:grid;grid-template-columns:repeat(5,var(--cell,52px));gap:7px;padding:10px;border-radius:16px;background:var(--surface2);border:3px solid var(--line);position:relative;transition:box-shadow .3s,border-color .3s}
.tf-frame.glow{border-color:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 35%,transparent)}
.tf-frame.full{border-color:var(--moss)}
.tf-frame.dim{opacity:.35}
.slot{width:var(--cell,52px);height:var(--cell,52px);border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;position:relative;touch-action:manipulation}
.slot.tap{cursor:pointer}
.slot.tap:hover{border-color:var(--tide);background:var(--info-bg)}
.ct{width:84%;height:84%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--unit) 55%,#fff),var(--unit) 55%,color-mix(in srgb,var(--unit) 75%,#000));box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 -3px 5px rgba(0,0,0,.15);cursor:pointer;transition:transform .15s ease,opacity .25s}
.ct:hover{transform:scale(1.07)}
.ct.added{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 60%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 70%,#000))}
.ct.off{opacity:.18;transform:scale(.8)}
.ct.fixed{cursor:default}
.ct.hide{visibility:hidden}
.ct.merge{transform:translate(var(--mx),var(--my)) scale(.2);opacity:0;transition:transform .45s ease-in,opacity .45s}
.fly{position:fixed;z-index:80;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--unit) 55%,#fff),var(--unit) 55%,color-mix(in srgb,var(--unit) 75%,#000));box-shadow:0 6px 12px rgba(0,0,0,.25)}
.fly.gold{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 60%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 70%,#000))}
.ten-token{width:calc(var(--cell,52px)*2.2);height:calc(var(--cell,52px)*2.2);border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:2.2rem;font-weight:600;color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ten) 55%,#fff),var(--ten) 55%,color-mix(in srgb,var(--ten) 70%,#000));box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 -5px 8px rgba(0,0,0,.18);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.line-wrap{width:100%}
.line-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.nl-tick{stroke:var(--ink2);stroke-width:2}
.nl-ten{stroke:var(--ten);stroke-width:4}
.nl-lab{fill:var(--ink2);font-family:var(--font-display);font-size:20px;text-anchor:middle}
.nl-lab.ten{fill:var(--ten);font-size:26px;font-weight:600}
.nl-hit{fill:transparent;cursor:pointer}
.nl-hit:hover{fill:color-mix(in srgb,var(--tide) 14%,transparent)}
.nl-arc{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.nl-hoplab{fill:var(--ink);font-family:var(--font-display);font-size:22px;text-anchor:middle;font-weight:600}
.faces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.face{width:116px;padding:14px 8px;border-radius:20px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.face:hover{border-color:var(--tide)}
.face svg{width:54px;height:54px}
.hl{animation:hl 1.2s ease-in-out infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 70%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 0%,transparent)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1;padding:10px}
.hero-dragon svg{width:min(260px,60vw);height:auto}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:10px 18px;min-width:130px}
.stat b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1.1}
.stat span{font-size:.9rem;color:var(--ink2)}
.breathe{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--tide),var(--tide2));margin:18px auto;animation:breath 8s ease-in-out infinite;opacity:.85}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.dash-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.sunbar{flex:1;min-width:140px;height:14px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.sunbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#ff9a4d);border-radius:99px;transition:width .25s linear}
.treats{display:flex;gap:4px;flex-wrap:wrap;min-height:36px}
.treats svg{width:30px;height:30px;animation:pop .35s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6em 1.2em;border-radius:14px;font-weight:500;z-index:90;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* grown-ups */
.gu{display:grid;gap:16px}
.gu h3{font-size:1.25rem;margin-bottom:4px}
.gu .note{color:var(--ink2);font-size:.95rem}
.gu .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.gu .box{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gu table{border-collapse:collapse;width:100%;font-size:.92rem}
.gu th,.gu td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.gu th{color:var(--ink2);font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:5px}
.fact{padding:3px 8px;border-radius:8px;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-variant-numeric:tabular-nums}
.fact.b0{background:var(--soft-bg);color:var(--soft)}
.fact.b1,.fact.b2{background:var(--info-bg);color:var(--ink)}
.fact.b3,.fact.b4,.fact.b5{background:var(--good-bg);color:var(--good);font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}
.barline{display:flex;align-items:flex-end;gap:6px;height:90px}
.barline i{flex:1;background:var(--tide);border-radius:6px 6px 0 0;min-height:3px;position:relative}
